<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Datos</title>
    <style>
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: Arial;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 12px;
        }
        h1 { color: #fbbf24; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .danger {
            background: #ef4444;
            color: white;
        }
        .danger:hover {
            background: #dc2626;
        }
        .success {
            background: #10b981;
            color: black;
        }
        .success:hover {
            background: #059669;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            min-height: 50px;
            display: none;
        }
        #status.show {
            display: block;
        }
        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            color: #86efac;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpiar Datos</h1>

        <button class="danger" onclick="clearResults()">🗑️ LIMPIAR SOLO RESULTADOS</button>
        <button class="danger" onclick="clearPredictions()">🗑️ LIMPIAR SOLO PREDICCIONES</button>
        <button class="danger" onclick="clearEverything()">💥 LIMPIAR TODO</button>

        <div id="status"></div>
    </div>

    <script>
        const SUPABASE_URL = 'REMOVED_USE_API_ROUTES';
        const SUPABASE_KEY = 'REMOVED';

        function showStatus(message, isSuccess) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'show ' + (isSuccess ? 'success-message' : 'error-message');
        }

        async function clearResults() {
            if (!confirm('¿SEGURO? Se borrarán TODOS los resultados.')) return;
            showStatus('Borrando resultados...', true);

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/results`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (res.ok || res.status === 204) {
                    showStatus('✅ Resultados borrados. Recarga la app.', true);
                } else {
                    showStatus('❌ Error: ' + res.status, false);
                }
            } catch (err) {
                showStatus('❌ ' + err.message, false);
            }
        }

        async function clearPredictions() {
            if (!confirm('¿SEGURO? Se borrarán TODAS las predicciones.')) return;
            showStatus('Borrando predicciones...', true);

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/predictions`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (res.ok || res.status === 204) {
                    showStatus('✅ Predicciones borradas. Recarga la app.', true);
                } else {
                    showStatus('❌ Error: ' + res.status, false);
                }
            } catch (err) {
                showStatus('❌ ' + err.message, false);
            }
        }

        async function clearEverything() {
            if (!confirm('⚠️ ¿REALMENTE? Se borrará TODO.')) return;
            if (!confirm('Segunda confirmación: ¿Está SEGURO?')) return;

            showStatus('Borrando todo...', true);

            try {
                await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/results`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }),
                    fetch(`${SUPABASE_URL}/rest/v1/predictions`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    })
                ]);

                showStatus('✅ TODO borrado. Recarga la app.', true);
            } catch (err) {
                showStatus('❌ ' + err.message, false);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Perth - Della Maddalena vs Prates - Betting Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts: Sora & EB Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F6F5F0',
                        charcoal: '#1A1A1A',
                        charcoalLight: '#333333',
                        secondary: '#666666',
                        accentWarm1: '#FF7A00',
                        accentWarm2: '#FFBA08',
                        accentCool1: '#0052D4',
                        accentCool2: '#4364F7',
                    },
                    fontFamily: {
                        sans: ['Sora', 'sans-serif'],
                        serif: ['EB Garamond', 'serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(26, 26, 26, 0.05)',
                        'glass-hover': '0 12px 40px 0 rgba(26, 26, 26, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F6F5F0;
            color: #1A1A1A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(217,100%,60%,0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(26, 26, 26, 0.05);
            transition: all 0.3s ease;
        }
        
        .glass-panel:hover {
            box-shadow: 0 12px 40px 0 rgba(26, 26, 26, 0.08);
            transform: translateY(-2px);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(246, 245, 240, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(26, 26, 26, 0.05);
            padding: 12px 0;
        }

        /* Custom Select Styling */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .score-number {
            background: linear-gradient(135deg, #FF7A00 0%, #FFBA08 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .score-number-cool {
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .btn-editorial {
            background: #1A1A1A;
            color: #F6F5F0;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .btn-editorial:hover {
            background: #333333;
            transform: translateY(-1px);
        }
        .btn-editorial:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const api = {
            async getPredictions() {
                const res = await fetch('/api/predictions');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async getResults() {
                const res = await fetch('/api/results');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async savePrediction(fight_id, player, field, value) {
                const res = await fetch('/api/predictions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fight_id, player, field, value })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async saveResult(fight_id, field, value) {
                const res = await fetch('/api/results', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fight_id, field, value })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async clearAllPredictions() {
                const res = await fetch('/api/predictions', { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async clearAllResults() {
                const res = await fetch('/api/results', { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async saveConfirmed(fight_id) {
                const res = await fetch('/api/confirmed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fight_id })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },
            async fetchGeminiResults() {
                const res = await fetch('/api/gemini-update', { method: 'POST' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            }
        };

        const UFCApp = () => {
            const [predictions, setPredictions] = useState({});
            const [results, setResults] = useState({});
            const [confirmedResults, setConfirmedResults] = useState({});
            const [connected, setConnected] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState('');
            const scrollRef = useRef(0);
            const lastLocalChangeRef = useRef(0);

            const getInitials = (name) => {
                return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            };

            const allFights = [
                {
                    id: 1,
                    fighter1: 'Jack Della Maddalena',
                    fighter2: 'Carlos Prates',
                    record1: '18-3-0',
                    record2: '23-7-0',
                    weight: 'Welterweight',
                    round: 5,
                    featured: true,
                    image1: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2024-03/DELLA_MADDALENA_JACK_L_03-09.png',
                    image2: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2024-08/PRATES_CARLOS_L_08-17.png'
                },
                {
                    id: 2,
                    fighter1: 'Tai Tuivasa',
                    fighter2: 'Louie Sutherland',
                    record1: '15-7-0',
                    record2: '6-3-0',
                    weight: 'Heavyweight',
                    round: 3,
                    featured: false,
                    image1: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2024-03/TUIVASA_TAI_L_03-16.png',
                    image2: ''
                },
                {
                    id: 3,
                    fighter1: 'Beneil Dariush',
                    fighter2: 'Quillan Salkilld',
                    record1: '22-6-1',
                    record2: '7-1-0',
                    weight: 'Lightweight',
                    round: 3,
                    featured: false,
                    image1: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2023-12/DARIUSH_BENEIL_L_12-02.png',
                    image2: ''
                },
                {
                    id: 4,
                    fighter1: 'Tim Elliott',
                    fighter2: 'Steve Erceg',
                    record1: '20-13-1',
                    record2: '12-3-0',
                    weight: 'Flyweight',
                    round: 3,
                    featured: false,
                    image1: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2023-12/ELLIOTT_TIM_L_12-09.png',
                    image2: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2024-05/ERCEG_STEVE_L_05-04.png'
                },
                {
                    id: 5,
                    fighter1: 'Marwan Rahiki',
                    fighter2: 'Ollie Schmid',
                    record1: '9-2-0',
                    record2: '7-1-0',
                    weight: 'Featherweight',
                    round: 3,
                    featured: false,
                    image1: '',
                    image2: ''
                },
                {
                    id: 6,
                    fighter1: 'Shamil Gaziev',
                    fighter2: 'Brando Pericic',
                    record1: '13-1-0',
                    record2: '8-1-0',
                    weight: 'Heavyweight',
                    round: 3,
                    featured: false,
                    image1: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2024-03/GAZIEV_SHAMIL_L_03-02.png',
                    image2: ''
                },
            ];

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const [preds, ress] = await Promise.all([
                            api.getPredictions(),
                            api.getResults()
                        ]);

                        const groupedPreds = {};
                        preds.forEach(pred => {
                            if (!groupedPreds[pred.fight_id]) groupedPreds[pred.fight_id] = {};
                            if (!groupedPreds[pred.fight_id][pred.player]) groupedPreds[pred.fight_id][pred.player] = {};
                            groupedPreds[pred.fight_id][pred.player][pred.field] = pred.value;
                        });
                        setPredictions(groupedPreds);

                        const groupedRes = {};
                        const confirmedFights = {};
                        ress.forEach(res => {
                            if (!groupedRes[res.fight_id]) groupedRes[res.fight_id] = {};
                            if (res.field === 'confirmed') {
                                confirmedFights[res.fight_id] = true;
                            } else {
                                groupedRes[res.fight_id][res.field] = res.value;
                            }
                        });
                        setResults(groupedRes);
                        setConfirmedResults(confirmedFights);
                        setConnected(true);
                    } catch (err) {
                        console.error('Error loading data:', err);
                        setConnected(false);
                    }
                };

                loadData();
            }, []);

            const updatePrediction = async (fightId, player, field, value) => {
                try {
                    lastLocalChangeRef.current = Date.now();
                    scrollRef.current = window.scrollY;
                    const newPreds = JSON.parse(JSON.stringify(predictions));
                    if (!newPreds[fightId]) newPreds[fightId] = {};
                    if (!newPreds[fightId][player]) newPreds[fightId][player] = {};
                    newPreds[fightId][player][field] = value;
                    setPredictions(newPreds);
                    setTimeout(() => window.scrollTo(0, scrollRef.current), 0);

                    api.savePrediction(fightId, player, field, value).catch(err => {
                        console.error('[API] Error:', err);
                    });
                } catch (err) {
                    console.error('Error:', err);
                }
            };

            const updateResult = async (fightId, field, value) => {
                try {
                    lastLocalChangeRef.current = Date.now();
                    scrollRef.current = window.scrollY;
                    const newRes = JSON.parse(JSON.stringify(results));
                    if (!newRes[fightId]) newRes[fightId] = {};
                    newRes[fightId][field] = value;
                    setResults(newRes);
                    setTimeout(() => window.scrollTo(0, scrollRef.current), 0);

                    api.saveResult(fightId, field, value).catch(err => {
                        console.error('[API] Error:', err);
                    });
                } catch (err) {
                    console.error('Error:', err);
                }
            };

            const clearAll = async () => {
                if (!window.confirm('¿Borrar TODAS las predicciones y resultados? NO se puede deshacer.')) return;
                try {
                    await Promise.all([api.clearAllPredictions(), api.clearAllResults()]);
                    setPredictions({});
                    setResults({});
                    alert('✓ Todo borrado exitosamente.');
                    setTimeout(() => window.location.reload(), 1000);
                } catch (err) {
                    alert('❌ Error: ' + err.message);
                }
            };

            const calculatePoints = (fightId, player) => {
                const pred = predictions[fightId]?.[player];
                const result = results[fightId];

                if (!pred || !pred.winner || !result || !result.winner) return 0;

                let points = 0;
                if (pred.winner === result.winner) points += 1;
                if (pred.method === result.method) points += 1;
                if (pred.round === result.round || (pred.round && result.round && parseInt(pred.round) === parseInt(result.round))) {
                    points += 1;
                }

                const fight = allFights.find(f => f.id === fightId);
                if (fight?.featured) return points * 2;
                return points;
            };

            const getTotalScore = (player) => {
                let total = 0;
                allFights.forEach(fight => {
                    total += calculatePoints(fight.id, player);
                });
                return total;
            };

            const getResultText = (fightId) => {
                const result = results[fightId];
                if (!result?.winner) return null;
                return `${result.winner} — ${result.method}${result.round && result.round !== 'final' ? ` (R${result.round})` : ' (Dec)'}`;
            };

            const sortedFights = [...allFights].sort((a, b) => {
                const aConfirmed = !!confirmedResults[a.id];
                const bConfirmed = !!confirmedResults[b.id];
                return aConfirmed - bConfirmed;
            });

            const confirmResult = (fightId) => {
                const res = results[fightId];
                if (!res?.winner || !res?.method || !res?.round) {
                    alert('⚠️ Completa Ganador, Método y Round antes de confirmar');
                    return;
                }
                setConfirmedResults({...confirmedResults, [fightId]: true});
                api.saveConfirmed(fightId).catch(err => console.error(err));
            };

            return (
                <div className="min-h-screen font-sans pb-24 text-charcoal">
                    {/* EDITORIAL HEADER */}
                    <div className="sticky-header">
                        <div className="max-w-5xl mx-auto px-4 md:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            
                            {/* TITLE & BADGE */}
                            <div className="flex flex-col items-center md:items-start">
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="bg-charcoal text-cream text-[10px] font-bold tracking-widest px-2 py-0.5 rounded-sm uppercase">Main Event</span>
                                    <span className={`w-2 h-2 rounded-full ${connected ? 'bg-green-500' : 'bg-red-500'} animate-pulse`}></span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black uppercase tracking-tight">UFC Perth</h1>
                                <p className="font-serif italic text-secondary text-lg">Della Maddalena vs. Prates</p>
                            </div>

                            {/* SCOREBOARD */}
                            <div className="flex items-center bg-white/40 backdrop-blur-md rounded-2xl p-2 px-6 border border-white/60 shadow-sm gap-8">
                                <div className="text-center">
                                    <p className="text-[10px] font-bold uppercase tracking-widest text-secondary mb-1">Papá</p>
                                    <div className="text-3xl font-black score-number leading-none">{getTotalScore('player1')}</div>
                                </div>
                                <div className="h-8 w-px bg-charcoal/10"></div>
                                <div className="text-center">
                                    <p className="text-[10px] font-bold uppercase tracking-widest text-secondary mb-1">Hijo</p>
                                    <div className="text-3xl font-black score-number-cool leading-none">{getTotalScore('player2')}</div>
                                </div>
                            </div>

                            {/* ADMIN ACTIONS */}
                            <div className="flex items-center gap-2">
                                <button onClick={() => isAdmin ? clearAll() : setShowLogin(true)} className="text-xs font-semibold px-4 py-2 rounded-lg border border-charcoal/10 hover:bg-white/50 transition">
                                    {isAdmin ? 'Reset Data' : 'Admin Login'}
                                </button>
                                {isAdmin && (
                                    <button 
                                        className="btn-editorial px-4 py-2 text-xs flex items-center gap-2"
                                        onClick={async () => {
                                            if (window.confirm('Update results automatically with Gemini?')) {
                                                try {
                                                    const res = await api.fetchGeminiResults();
                                                    alert('Success: ' + res.message);
                                                    window.location.reload();
                                                } catch (err) {
                                                    alert('Error: ' + err.message);
                                                }
                                            }
                                        }}
                                    >
                                        <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                        Auto Update
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT GRID */}
                    <div className="max-w-5xl mx-auto px-4 md:px-8 mt-12">
                        
                        <h2 className="text-sm font-bold uppercase tracking-widest text-secondary mb-6 border-b border-charcoal/10 pb-2">Fight Card Predictions</h2>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* LEFT COLUMN: FIGHTS */}
                            <div className="lg:col-span-8 space-y-6">
                                {sortedFights.map((fight, idx) => (
                                    <div key={fight.id} className="glass-panel p-6 relative overflow-hidden">
                                        
                                        {/* Status Line */}
                                        {confirmedResults[fight.id] && getResultText(fight.id) && (
                                            <div className="absolute top-0 left-0 w-full bg-green-100 border-b border-green-200 px-6 py-2 flex items-center justify-between">
                                                <span className="text-xs font-bold text-green-800 uppercase tracking-widest">Official Result</span>
                                                <span className="text-sm font-serif italic text-green-900">{getResultText(fight.id)}</span>
                                            </div>
                                        )}

                                        <div className={`mt-${confirmedResults[fight.id] ? '8' : '0'}`}>
                                            
                                            {/* FIGHTER VERSUS LAYOUT */}
                                            <div className="flex items-center justify-between mb-8">
                                                
                                                {/* Fighter 1 */}
                                                <div className="flex flex-col items-start w-2/5">
                                                    <div className="flex items-center gap-4 mb-3">
                                                        <div className="w-16 h-16 rounded-full bg-cream border-2 border-white shadow-sm overflow-hidden flex items-center justify-center shrink-0">
                                                            {fight.image1 ? (
                                                                <img src={fight.image1} alt={fight.fighter1} className="w-full h-full object-cover object-top" />
                                                            ) : (
                                                                <span className="text-xl font-bold text-charcoal/30">{getInitials(fight.fighter1)}</span>
                                                            )}
                                                        </div>
                                                        <div>
                                                            <h3 className="text-lg md:text-xl font-bold leading-none">{fight.fighter1}</h3>
                                                            <p className="font-serif italic text-secondary text-sm mt-1">{fight.record1}</p>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* VS Badge */}
                                                <div className="w-1/5 flex flex-col items-center justify-center">
                                                    <span className="text-xs font-bold text-secondary/50 uppercase tracking-widest mb-1">VS</span>
                                                    <span className="text-[10px] bg-charcoal/5 text-charcoal px-2 py-1 rounded font-semibold whitespace-nowrap">{fight.weight}</span>
                                                    <span className="text-[10px] text-secondary mt-1">{fight.round} Rnds</span>
                                                </div>

                                                {/* Fighter 2 */}
                                                <div className="flex flex-col items-end w-2/5 text-right">
                                                    <div className="flex items-center gap-4 mb-3 flex-row-reverse">
                                                        <div className="w-16 h-16 rounded-full bg-cream border-2 border-white shadow-sm overflow-hidden flex items-center justify-center shrink-0">
                                                            {fight.image2 ? (
                                                                <img src={fight.image2} alt={fight.fighter2} className="w-full h-full object-cover object-top" />
                                                            ) : (
                                                                <span className="text-xl font-bold text-charcoal/30">{getInitials(fight.fighter2)}</span>
                                                            )}
                                                        </div>
                                                        <div>
                                                            <h3 className="text-lg md:text-xl font-bold leading-none">{fight.fighter2}</h3>
                                                            <p className="font-serif italic text-secondary text-sm mt-1">{fight.record2}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <hr className="border-charcoal/5 mb-6" />

                                            {/* PREDICTIONS SECTION */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                
                                                {/* PAPA */}
                                                <div className="bg-cream/50 rounded-xl p-4 border border-white">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="text-xs font-bold uppercase tracking-widest text-accentWarm1">Papá</h4>
                                                        <span className="text-xs font-bold bg-white px-2 py-0.5 rounded shadow-sm">
                                                            {calculatePoints(fight.id, 'player1')} <span className="text-secondary/50 font-normal">pts</span>
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="space-y-3">
                                                        <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm font-semibold text-charcoal focus:outline-none focus:ring-2 focus:ring-accentWarm1/50"
                                                                value={predictions[fight.id]?.player1?.winner || ''}
                                                                onChange={(e) => updatePrediction(fight.id, 'player1', 'winner', e.target.value)}>
                                                            <option value="" disabled>Ganador...</option>
                                                            <option value={fight.fighter1}>{fight.fighter1}</option>
                                                            <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        </select>

                                                        <div className="grid grid-cols-2 gap-3">
                                                            <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm text-charcoal focus:outline-none focus:ring-2 focus:ring-accentWarm1/50"
                                                                    value={predictions[fight.id]?.player1?.method || ''}
                                                                    onChange={(e) => updatePrediction(fight.id, 'player1', 'method', e.target.value)}>
                                                                <option value="" disabled>Vía...</option>
                                                                <option value="Decisión">Decisión</option>
                                                                <option value="KO/TKO">KO/TKO</option>
                                                                <option value="Sumisión">Sumisión</option>
                                                            </select>
                                                            
                                                            <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm text-charcoal focus:outline-none focus:ring-2 focus:ring-accentWarm1/50"
                                                                    value={predictions[fight.id]?.player1?.round || ''}
                                                                    onChange={(e) => updatePrediction(fight.id, 'player1', 'round', e.target.value)}>
                                                                <option value="" disabled>Round...</option>
                                                                {Array.from({length: fight.round}, (_, i) => <option key={i+1} value={i+1}>R{i+1}</option>)}
                                                                <option value="final">Decisión</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* HIJO */}
                                                <div className="bg-cream/50 rounded-xl p-4 border border-white">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="text-xs font-bold uppercase tracking-widest text-accentCool1">Hijo</h4>
                                                        <span className="text-xs font-bold bg-white px-2 py-0.5 rounded shadow-sm">
                                                            {calculatePoints(fight.id, 'player2')} <span className="text-secondary/50 font-normal">pts</span>
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="space-y-3">
                                                        <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm font-semibold text-charcoal focus:outline-none focus:ring-2 focus:ring-accentCool1/50"
                                                                value={predictions[fight.id]?.player2?.winner || ''}
                                                                onChange={(e) => updatePrediction(fight.id, 'player2', 'winner', e.target.value)}>
                                                            <option value="" disabled>Ganador...</option>
                                                            <option value={fight.fighter1}>{fight.fighter1}</option>
                                                            <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        </select>

                                                        <div className="grid grid-cols-2 gap-3">
                                                            <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm text-charcoal focus:outline-none focus:ring-2 focus:ring-accentCool1/50"
                                                                    value={predictions[fight.id]?.player2?.method || ''}
                                                                    onChange={(e) => updatePrediction(fight.id, 'player2', 'method', e.target.value)}>
                                                                <option value="" disabled>Vía...</option>
                                                                <option value="Decisión">Decisión</option>
                                                                <option value="KO/TKO">KO/TKO</option>
                                                                <option value="Sumisión">Sumisión</option>
                                                            </select>
                                                            
                                                            <select className="w-full bg-white border border-charcoal/10 rounded-lg px-3 py-2 text-sm text-charcoal focus:outline-none focus:ring-2 focus:ring-accentCool1/50"
                                                                    value={predictions[fight.id]?.player2?.round || ''}
                                                                    onChange={(e) => updatePrediction(fight.id, 'player2', 'round', e.target.value)}>
                                                                <option value="" disabled>Round...</option>
                                                                {Array.from({length: fight.round}, (_, i) => <option key={i+1} value={i+1}>R{i+1}</option>)}
                                                                <option value="final">Decisión</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>

                                            </div>

                                            {/* ADMIN RESULT INPUT */}
                                            {isAdmin && !confirmedResults[fight.id] && (
                                                <div className="mt-6 pt-6 border-t border-charcoal/5">
                                                    <div className="flex items-center gap-3">
                                                        <select className="flex-1 bg-charcoal/5 border-transparent rounded-lg px-3 py-2 text-xs font-semibold focus:ring-2 focus:ring-charcoal"
                                                                value={results[fight.id]?.winner || ''}
                                                                onChange={(e) => updateResult(fight.id, 'winner', e.target.value)}>
                                                            <option value="">Oficial: Ganador...</option>
                                                            <option value={fight.fighter1}>{fight.fighter1}</option>
                                                            <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        </select>
                                                        <select className="w-24 bg-charcoal/5 border-transparent rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-charcoal"
                                                                value={results[fight.id]?.method || ''}
                                                                onChange={(e) => updateResult(fight.id, 'method', e.target.value)}>
                                                            <option value="">Método</option>
                                                            <option value="Decisión">Decisión</option>
                                                            <option value="KO/TKO">KO</option>
                                                            <option value="Sumisión">Sumisión</option>
                                                        </select>
                                                        <select className="w-24 bg-charcoal/5 border-transparent rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-charcoal"
                                                                value={results[fight.id]?.round || ''}
                                                                onChange={(e) => updateResult(fight.id, 'round', e.target.value)}>
                                                            <option value="">Rnd</option>
                                                            {Array.from({length: fight.round}, (_, i) => <option key={i+1} value={i+1}>{i+1}</option>)}
                                                            <option value="final">Final</option>
                                                        </select>
                                                        <button 
                                                            onClick={() => confirmResult(fight.id)}
                                                            className="btn-editorial px-4 py-2 text-xs whitespace-nowrap"
                                                        >
                                                            Confirmar
                                                        </button>
                                                    </div>
                                                </div>
                                            )}

                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* RIGHT COLUMN: SUMMARY STICKY */}
                            <div className="lg:col-span-4 relative">
                                <div className="sticky top-28 space-y-6">
                                    <div className="glass-panel p-6">
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-secondary mb-4 border-b border-charcoal/10 pb-2">Resumen: Papá</h3>
                                        <div className="space-y-3">
                                            {allFights.map(fight => {
                                                const pred = predictions[fight.id]?.player1;
                                                return (
                                                    <div key={fight.id} className="flex items-center justify-between text-sm">
                                                        <span className="font-semibold text-charcoal truncate pr-2">{fight.fighter1.split(' ')[0]} vs {fight.fighter2.split(' ')[0]}</span>
                                                        {pred?.winner ? (
                                                            <span className="text-xs text-secondary whitespace-nowrap">{pred.winner.split(' ').pop()} • {pred.method}</span>
                                                        ) : (
                                                            <span className="text-xs text-charcoal/20 italic">Pendiente</span>
                                                        )}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>

                                    <div className="glass-panel p-6">
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-secondary mb-4 border-b border-charcoal/10 pb-2">Resumen: Hijo</h3>
                                        <div className="space-y-3">
                                            {allFights.map(fight => {
                                                const pred = predictions[fight.id]?.player2;
                                                return (
                                                    <div key={fight.id} className="flex items-center justify-between text-sm">
                                                        <span className="font-semibold text-charcoal truncate pr-2">{fight.fighter1.split(' ')[0]} vs {fight.fighter2.split(' ')[0]}</span>
                                                        {pred?.winner ? (
                                                            <span className="text-xs text-secondary whitespace-nowrap">{pred.winner.split(' ').pop()} • {pred.method}</span>
                                                        ) : (
                                                            <span className="text-xs text-charcoal/20 italic">Pendiente</span>
                                                        )}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* LOGIN MODAL */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="glass-panel p-8 w-full max-w-sm">
                                <h2 className="font-serif italic text-2xl mb-1 text-center">Acceso Admin</h2>
                                <p className="text-xs text-secondary text-center mb-6 uppercase tracking-widest font-bold">Autenticación requerida</p>
                                
                                <input 
                                    type="password" 
                                    placeholder="Contraseña..." 
                                    className="w-full mb-6 bg-white border border-charcoal/10 focus:border-charcoal focus:ring-1 focus:ring-charcoal rounded-lg px-4 py-3 text-sm transition"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && (password === 'ufc2026' ? (setIsAdmin(true), setShowLogin(false)) : alert('Incorrecto'))}
                                />
                                <div className="flex gap-3">
                                    <button 
                                        className="flex-1 border border-charcoal/20 text-charcoal font-semibold py-2.5 rounded-lg hover:bg-charcoal/5 transition text-sm"
                                        onClick={() => setShowLogin(false)}
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        className="flex-1 btn-editorial text-sm"
                                        onClick={() => password === 'ufc2026' ? (setIsAdmin(true), setShowLogin(false)) : alert('Incorrecto')}
                                    >
                                        Acceder
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

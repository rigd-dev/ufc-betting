                return fetch('/api/predictions', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fight_id, player, field, value}) });
            },
            async saveResult(fight_id, field, value) {
                return fetch('/api/results', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fight_id, field, value}) });
            },
            async clearAll() { await fetch('/api/predictions', { method: 'DELETE' }); await fetch('/api/results', { method: 'DELETE' }); },

            async unconfirm(fight_id) { return fetch(`/api/results?fight_id=${fight_id}&field=confirmed`, { method: 'DELETE' }); },

                    f2: { name: 'Brando Pericic', country: 'au', age: 27, height: '185cm', reach: '191cm', rec: '8-1-0', odds: '+155', oddsType: 'Underdog', img: '', style: 'Striker', specialty: 'Gancho derecha', recent: [{r:'W', m:'KO/TKO', rnd:1}, {r:'W', m:'KO/TKO', rnd:1}, {r:'W', m:'Decisión', rnd:3}, {r:'L', m:'Sumisión', rnd:2}, {r:'W', m:'KO/TKO', rnd:1}] }
                },

                },
                { id: 8, type: 'Preliminar', round: 3, weight: 'Peso Medio',

                },
                { id: 9, type: 'Preliminar', round: 3, weight: 'Peso Pluma',
                    f1: { name: 'Jack Jenkins', country: 'au', age: 30, height: '175cm', reach: '178cm', rec: '12-3-0', odds: '-150', oddsType: 'Favorito', img: 'https://dmxg5wxfqgb4u.cloudfront.net/styles/athlete_bio_full_body/s3/2023-02/JENKINS_JACK_L_02-11.png', style: 'Striker', specialty: 'Pateo piernas', recent: [{r:'L', m:'KO/TKO', rnd:2}, {r:'W', m:'Decisión', rnd:3}, {r:'W', m:'Decisión', rnd:3}, {r:'W', m:'KO/TKO', rnd:3}, {r:'W', m:'Decisión', rnd:3}] },

                }
            ];

            useEffect(() => {
                const load = async () => {
                    const [preds, ress] = await Promise.all([api.getPredictions(), api.getResults()]);
                    const pMap = {}, rMap = {}, cMap = {};
                    preds.forEach(p => { if(!pMap[p.fight_id]) pMap[p.fight_id]={}; if(!pMap[p.fight_id][p.player]) pMap[p.fight_id][p.player]={}; pMap[p.fight_id][p.player][p.field] = p.value; });
                    ress.forEach(r => { if(!rMap[r.fight_id]) rMap[r.fight_id]={}; if(r.field==='confirmed') cMap[r.fight_id]=true; else rMap[r.fight_id][r.field] = r.value; });
                    setPredictions(pMap); setResults(rMap); setConfirmedResults(cMap);
                };
                load();
            }, []);

            const handlePred = (id, pl, f, v) => { setPredictions(prev => ({...prev, [id]: {...prev[id], [pl]: {...(prev[id]?.[pl]||{}), [f]: v}}})); api.savePrediction(id, pl, f, v); };
            const handleRes = (id, f, v) => { setResults(prev => ({...prev, [id]: {...(prev[id]||{}), [f]: v}})); api.saveResult(id, f, v); };
            const calcPts = (id, pl) => {
                const p = predictions[id]?.[pl], r = results[id];
                if (!p?.winner || !r?.winner || !confirmedResults[id]) return 0;
                let pts = 0;
                if (p.winner === r.winner) pts += 1;
                if (p.method === r.method) pts += 1;
                if (p.round == r.round || (p.round === 'final' && r.round === 'final')) pts += 1;
                return allFights.find(f => f.id === id)?.featured ? pts * 2 : pts;
            };

            const papaScore = allFights.reduce((acc, f) => acc + calcPts(f.id, 'player1'), 0);
            const hijoScore = allFights.reduce((acc, f) => acc + calcPts(f.id, 'player2'), 0);

            const currentFight = allFights.find(f => f.id === activeFightId);

            return (

                                        <button onClick={() => setTaleOfTape(currentFight)} className="bg-charcoal/5 hover:bg-charcoal text-charcoal hover:text-white p-3 rounded-full transition shadow-sm border border-charcoal/10">📊</button>
                                        <div className="text-2xl md:text-5xl font-black opacity-10">VS</div>
                                        <div className="text-center"><div className="text-[10px] font-black bg-charcoal/5 px-2 py-1 rounded mb-1">{currentFight.weight}</div><div className="text-[10px] font-black bg-charcoal text-white px-2 py-1 rounded">{currentFight.round} RNDS</div></div>
                                    </div>

                                    <div className="flex-1 text-center group cursor-pointer" onClick={() => setModalFighter(currentFight.f2)}>
                                        <div className="relative inline-block mb-4">
                                            <div className="w-24 h-24 md:w-48 md:h-48 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white">
                                                <img src={currentFight.f2.img || getSilhouette(currentFight.f2.name)} className="w-full h-full object-cover object-top" />
                                            </div>
                                            <img src={getFlag(currentFight.f2.country)} className="absolute bottom-0 right-0 w-8 h-8 md:w-12 md:h-12 border-4 border-white rounded-full shadow-lg" />
                                        </div>
                                        <h3 className="text-lg md:text-3xl font-black mb-1">{currentFight.f2.name}</h3>
                                        <div className={`inline-block text-[10px] font-black px-3 py-1 rounded-full mb-2 ${currentFight.f2.oddsType === 'Favorito' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{currentFight.f2.odds}</div>
                                        <p className="text-secondary text-xs font-serif italic">{currentFight.f2.rec}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {['player1', 'player2'].map((p, i) => (
                                        <div key={p} className={`p-6 rounded-3xl border-2 ${i === 0 ? 'bg-orange-50 border-orange-100' : 'bg-blue-50 border-blue-100'}`}>
                                            <div className="text-xs font-black uppercase mb-4 opacity-50">{i === 0 ? 'Pick Papá' : 'Pick Hijo'}</div>
                                            <select className="w-full bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-sm font-bold mb-3" value={predictions[currentFight.id]?.[p]?.winner || ''} onChange={e => handlePred(currentFight.id, p, 'winner', e.target.value)}>
                                                <option value="" disabled>Selecciona Ganador...</option>
                                                <option value={currentFight.f1.name}>{currentFight.f1.name}</option>
                                                <option value={currentFight.f2.name}>{currentFight.f2.name}</option>
                                            </select>
                                            <div className="flex gap-2">
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-xs font-bold" value={predictions[currentFight.id]?.[p]?.method || ''} onChange={e => handlePred(currentFight.id, p, 'method', e.target.value)}><option value="" disabled>Método</option><option value="Decisión">Decisión</option><option value="KO/TKO">KO/TKO</option><option value="Sumisión">Sumisión</option></select>
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-xs font-bold" value={predictions[currentFight.id]?.[p]?.round || ''} onChange={e => handlePred(currentFight.id, p, 'round', e.target.value)}><option value="" disabled>Round</option>{Array.from({length: currentFight.round}, (_, i) => <option key={i+1} value={i+1}>R{i+1}</option>)}<option value="final">F</option></select>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {isAdmin && (
                                    <div className="mt-12 pt-8 border-t border-charcoal/10 flex flex-wrap gap-4 items-center justify-center">
                                        <div className="text-[10px] font-black bg-charcoal text-white px-3 py-1 rounded">ADMIN</div>
                                        <select className="bg-white border rounded-xl px-4 py-2 text-xs font-bold" value={results[currentFight.id]?.winner || ''} onChange={e => handleRes(currentFight.id, 'winner', e.target.value)} disabled={confirmedResults[currentFight.id]}><option value="">Ganador...</option><option value={currentFight.f1.name}>{currentFight.f1.name}</option><option value={currentFight.f2.name}>{currentFight.f2.name}</option></select>
                                        <button onClick={() => { setConfirmedResults(p=>({...p,[currentFight.id]:!p[currentFight.id]})); confirmedResults[currentFight.id] ? api.unconfirm(currentFight.id) : api.saveConfirmed(currentFight.id); }} className={`px-6 py-2 rounded-xl text-xs font-black uppercase transition ${confirmedResults[currentFight.id] ? 'bg-gray-200' : 'bg-success text-white'}`}>{confirmedResults[currentFight.id] ? 'Editar' : 'Confirmar'}</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {modalFighter && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/40 backdrop-blur-md" onClick={() => setModalFighter(null)}>
                            <div className="bg-white/90 backdrop-blur-2xl rounded-[40px] p-8 md:p-12 w-full max-w-xl shadow-2xl border border-white relative max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-8"><div className="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-xl"><img src={modalFighter.img || getSilhouette(modalFighter.name)} className="w-full h-full object-cover object-top" /></div><button onClick={() => setModalFighter(null)} className="text-4xl">&times;</button></div>
                                <h2 className="text-4xl font-black mb-2">{modalFighter.name}</h2>
                                <div className="flex items-center gap-3 mb-8"><img src={getFlag(modalFighter.country)} className="w-10 rounded shadow-sm" /><span className="text-xl font-serif italic">{modalFighter.rec}</span></div>
                                <div className="grid grid-cols-2 gap-4 mb-8"><div className="bg-charcoal/5 p-6 rounded-3xl"><div className="text-[10px] font-black uppercase mb-1 opacity-50">Estilo</div><div className="font-bold">{modalFighter.style}</div></div><div className="bg-charcoal/5 p-6 rounded-3xl"><div className="text-[10px] font-black uppercase mb-1 opacity-50">Especialidad</div><div className="font-bold">{modalFighter.specialty}</div></div></div>
                                <div className="space-y-4">
                                    <div className="text-xs font-black uppercase tracking-widest border-b pb-2">Últimas Peleas</div>
                                    {modalFighter.recent.map((f, i) => (
                                        <div key={i} className="flex justify-between items-center"><div className="flex items-center gap-4"><span className={`w-8 h-8 flex items-center justify-center font-black rounded-full text-xs ${f.r === 'W' ? 'bg-success/20 text-success' : 'bg-danger/10 text-danger'}`}>{f.r}</span><span className="font-bold">{f.r === 'W' ? 'Victoria' : 'Derrota'}</span></div><div className="text-right"><div className="text-xs font-bold">{f.m}</div><div className="text-[10px] opacity-50">RND {f.rnd}</div></div></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {taleOfTape && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/40 backdrop-blur-md" onClick={() => setTaleOfTape(null)}>
                            <div className="bg-charcoal text-white rounded-[40px] p-8 md:p-12 w-full max-w-2xl shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setTaleOfTape(null)} className="absolute top-8 right-8 text-4xl">&times;</button>
                                <h2 className="text-center text-xs font-black tracking-[0.4em] uppercase mb-12 opacity-50">Cara a Cara</h2>
                                <div className="flex justify-between items-center gap-4">
                                    <div className="flex-1 text-center"><div className="text-xl font-black mb-1">{taleOfTape.f1.name}</div><div className="text-[10px] opacity-50 uppercase">{taleOfTape.f1.rec}</div></div>
                                    <div className="text-xs font-black opacity-20">VS</div>
                                    <div className="flex-1 text-center"><div className="text-xl font-black mb-1">{taleOfTape.f2.name}</div><div className="text-[10px] opacity-50 uppercase">{taleOfTape.f2.rec}</div></div>
                                </div>
                                <div className="mt-12 space-y-8">
                                    {[ ['EDAD', 'age'], ['ALTURA', 'height'], ['ALCANCE', 'reach'] ].map(([label, key]) => (
                                        <div key={key} className="relative"><div className="flex justify-between text-lg font-black mb-2"><span>{taleOfTape.f1[key]}</span><span>{taleOfTape.f2[key]}</span></div><div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[8px] font-black tracking-widest opacity-30">{label}</div><div className="h-1 bg-white/10 rounded-full overflow-hidden flex"><div className="h-full bg-accentWarm" style={{width: '50%'}}></div><div className="h-full bg-accentCool" style={{width: '50%'}}></div></div></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

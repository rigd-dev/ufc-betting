                        <div className="flex overflow-x-auto gap-2 mb-8 pb-3 custom-scrollbar">
                            {filteredFights.map(f => (
                                <button key={f.id} onClick={() => setActiveFightId(f.id)} className={`px-6 py-2.5 rounded-full font-black text-[11px] uppercase border-2 transition-all flex-shrink-0 ${activeFightId === f.id ? 'bg-charcoal text-cream border-charcoal shadow-lg scale-105' : 'bg-white border-charcoal/5 hover:border-charcoal/20 opacity-70'}`}>
                                    Pelea {f.id}
                                </button>
                            ))}
                        </div>

                        {currentFight && (
                            <div className="glass-panel p-6 md:p-12 relative animate-fade-in border-white/40">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-charcoal text-cream text-[11px] font-black uppercase tracking-[0.2em] px-8 py-2.5 rounded-full border-4 border-white shadow-2xl z-20">
                                    {currentFight.type} {currentFight.featured && '• Doble Puntaje'}
                                </div>

                                <div className="flex justify-between items-center mb-16 mt-6 gap-2">
                                    <div className="flex-1 text-center group cursor-pointer" onClick={() => setModalFighter(currentFight.f1)}>
                                        <div className="relative inline-block mb-6">
                                            <div className="w-24 h-24 sm:w-32 sm:h-32 md:w-56 md:h-56 rounded-full border-4 border-white shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden bg-white/50 group-hover:scale-[1.02] transition-transform"><img src={currentFight.f1.img || getSilhouette(currentFight.f1.name)} className="w-full h-full object-cover object-top" /></div>
                                            <img src={getFlag(currentFight.f1.country)} className="absolute bottom-1 right-1 w-8 h-8 md:w-16 md:h-16 border-4 border-white rounded-full shadow-2xl" />
                                        </div>
                                        <h3 className="text-sm md:text-3xl font-black mb-2 leading-tight uppercase tracking-tight">{currentFight.f1.name}</h3>
                                        <div className={`text-[10px] md:text-xs font-black px-3 py-1 rounded-md inline-block shadow-sm ${currentFight.f1.oddsType === 'Favorito' ? 'odds-fav' : 'odds-dog'}`}>
                                            {currentFight.f1.oddsType} <span className="font-bold">{currentFight.f1.odds}</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col items-center gap-6">
                                        <button onClick={() => setTaleOfTape(currentFight)} className="w-12 h-12 md:w-16 md:h-16 bg-white hover:bg-charcoal text-charcoal hover:text-white rounded-full transition-all flex items-center justify-center border-2 border-charcoal/5 shadow-xl text-xl md:text-3xl hover:scale-110">📊</button>
                                        <div className="text-2xl md:text-6xl font-black opacity-5 italic tracking-tighter">VS</div>
                                        <div className="text-center space-y-1.5">
                                            <div className="text-[10px] md:text-xs font-black bg-white px-4 py-1.5 rounded-full border border-charcoal/10 shadow-sm uppercase tracking-wider">{currentFight.weight}</div>
                                            <div className="text-[10px] md:text-xs font-black bg-charcoal text-white px-4 py-1.5 rounded-full shadow-lg uppercase tracking-wider">{currentFight.round} RNDS</div>
                                        </div>
                                    </div>

                                    <div className="flex-1 text-center group cursor-pointer" onClick={() => setModalFighter(currentFight.f2)}>
                                        <div className="relative inline-block mb-6">
                                            <div className="w-24 h-24 sm:w-32 sm:h-32 md:w-56 md:h-56 rounded-full border-4 border-white shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden bg-white/50 group-hover:scale-[1.02] transition-transform"><img src={currentFight.f2.img || getSilhouette(currentFight.f2.name)} className="w-full h-full object-cover object-top" /></div>
                                            <img src={getFlag(currentFight.f2.country)} className="absolute bottom-1 right-1 w-8 h-8 md:w-16 md:h-16 border-4 border-white rounded-full shadow-2xl" />
                                        </div>
                                        <h3 className="text-sm md:text-3xl font-black mb-2 leading-tight uppercase tracking-tight">{currentFight.f2.name}</h3>
                                        <div className={`text-[10px] md:text-xs font-black px-3 py-1 rounded-md inline-block shadow-sm ${currentFight.f2.oddsType === 'Favorito' ? 'odds-fav' : 'odds-dog'}`}>
                                            {currentFight.f2.oddsType} <span className="font-bold">{currentFight.f2.odds}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {['player1', 'player2'].map((p, i) => (
                                        <div key={p} className={`p-8 rounded-[32px] border-2 transition-all hover:shadow-2xl ${i === 0 ? 'bg-orange-50/50 border-orange-100 hover:border-orange-300' : 'bg-blue-50/50 border-blue-100 hover:border-blue-300'}`}>
                                            <div className="flex justify-between items-center mb-6">
                                                <span className={`text-[11px] font-black uppercase tracking-[0.2em] px-4 py-1.5 rounded-xl shadow-sm ${i === 0 ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{i === 0 ? 'Pick Papá' : 'Pick Hijo'}</span>
                                                {confirmedResults[currentFight.id] && <span className="text-xs font-black bg-white px-4 py-1.5 rounded-xl border border-charcoal/5 shadow-sm text-success">+{calcPts(currentFight.id, p)} Pts</span>}
                                            </div>
                                            <select className="w-full bg-white border border-charcoal/10 rounded-2xl px-5 py-4 text-sm font-black mb-4 focus:ring-4 focus:ring-charcoal/5 outline-none transition-all shadow-sm" value={predictions[currentFight.id]?.[p]?.winner || ''} onChange={e => handlePred(currentFight.id, p, 'winner', e.target.value)}>
                                                <option value="" disabled>Seleccionar Ganador...</option>
                                                <option value={currentFight.f1.name}>{currentFight.f1.name}</option>
                                                <option value={currentFight.f2.name}>{currentFight.f2.name}</option>
                                            </select>
                                            <div className="flex gap-3">
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-2xl px-5 py-4 text-xs font-bold shadow-sm" value={predictions[currentFight.id]?.[p]?.method || ''} onChange={e => handlePred(currentFight.id, p, 'method', e.target.value)}><option value="" disabled>Método</option><option value="Decisión">Decisión</option><option value="KO/TKO">KO/TKO</option><option value="Sumisión">Sumisión</option></select>
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-2xl px-5 py-4 text-xs font-bold shadow-sm" value={predictions[currentFight.id]?.[p]?.round || ''} onChange={e => handlePred(currentFight.id, p, 'round', e.target.value)}><option value="" disabled>Round</option>{Array.from({length: currentFight.round}, (_, i) => <option key={i+1} value={i+1}>R{i+1}</option>)}<option value="final">Final</option></select>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {isAdmin && (
                                    <div className="mt-16 pt-10 border-t-4 border-dotted border-charcoal/10 flex flex-wrap gap-4 items-center justify-center bg-charcoal/5 p-8 rounded-[40px]">
                                        <div className="text-[11px] font-black uppercase tracking-widest opacity-40 w-full text-center mb-2">Panel de Control Oficial</div>
                                        <select className="bg-white border-2 border-charcoal/20 rounded-2xl px-6 py-3 text-sm font-black shadow-lg" value={results[currentFight.id]?.winner || ''} onChange={e => handleRes(currentFight.id, 'winner', e.target.value)} disabled={confirmedResults[currentFight.id]}><option value="">RESULTADO FINAL...</option><option value={currentFight.f1.name}>{currentFight.f1.name}</option><option value={currentFight.f2.name}>{currentFight.f2.name}</option></select>
                                        <button onClick={() => { setConfirmedResults(p=>({...p,[currentFight.id]:!p[currentFight.id]})); confirmedResults[currentFight.id] ? api.unconfirm(currentFight.id) : api.saveConfirmed(currentFight.id); }} className={`px-10 py-3 rounded-2xl text-xs font-black uppercase tracking-widest transition shadow-xl ${confirmedResults[currentFight.id] ? 'bg-charcoal text-white' : 'bg-success text-white'}`}>{confirmedResults[currentFight.id] ? '🔓 Editar' : '🔒 Confirmar Resultado'}</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {modalFighter && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/70 backdrop-blur-xl" onClick={() => setModalFighter(null)}>
                            <div className="bg-cream/95 backdrop-blur-3xl rounded-[50px] p-8 md:p-14 w-full max-w-2xl shadow-[0_30px_100px_rgba(0,0,0,0.3)] border border-white relative max-h-[92vh] overflow-y-auto custom-scrollbar flex flex-col animate-fade-in" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setModalFighter(null)} className="absolute top-10 right-10 w-12 h-12 bg-charcoal text-white rounded-full flex items-center justify-center text-4xl hover:rotate-90 transition-transform">&times;</button>
                                
                                <div className="flex items-center gap-8 mb-10 pb-8 border-b border-charcoal/10">
                                    <div className="w-32 h-32 md:w-44 md:h-44 rounded-full overflow-hidden border-8 border-white shadow-2xl bg-white flex-shrink-0">
                                        <img src={modalFighter.img || getSilhouette(modalFighter.name)} className="w-full h-full object-cover object-top" />
                                    </div>
                                    <div>
                                        <h2 className="text-4xl md:text-6xl font-black mb-2 uppercase tracking-tight leading-none">{modalFighter.name}</h2>
                                        <div className="flex items-center gap-3">
                                            <img src={getFlag(modalFighter.country)} className="w-12 rounded-lg shadow-md border border-white/40" />
                                            <span className="text-2xl font-serif italic text-secondary">{modalFighter.rec}</span>
                                            <span className="bg-charcoal text-white text-[10px] font-black px-3 py-1 rounded-full uppercase ml-2 tracking-widest">{getWeightLbs(allFights.find(f => f.f1.name === modalFighter.name || f.f2.name === modalFighter.name)?.weight)}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                                    <div className="bg-white/70 p-7 rounded-[35px] border border-white shadow-sm">
                                        <div className="text-[11px] font-black uppercase mb-2 text-secondary opacity-60 tracking-widest">Estilo Principal</div>
                                        <div className="text-xl font-black">{modalFighter.style}</div>
                                    </div>
                                    <div className="bg-white/70 p-7 rounded-[35px] border border-white shadow-sm">
                                        <div className="text-[11px] font-black uppercase mb-2 text-secondary opacity-60 tracking-widest">Especialidad</div>
                                        <div className="text-xl font-black">{modalFighter.specialty}</div>
                                    </div>
                                </div>

                                <div className="space-y-5 flex-1">
                                    <div className="text-xs font-black uppercase tracking-[0.4em] pb-3 border-b-2 border-charcoal/5 opacity-40">Historial Reciente (Últimas 5)</div>
                                    <div className="space-y-4">
                                        {modalFighter.recent.map((f, i) => (
                                            <div key={i} className="flex justify-between items-center p-5 bg-white/40 rounded-3xl border border-white/50">
                                                <div className="flex items-center gap-5">
                                                    <span className={`w-12 h-12 flex items-center justify-center font-black rounded-full text-lg border-4 shadow-sm ${f.r === 'W' ? 'bg-success/20 text-success border-success/30' : 'bg-danger/20 text-danger border-danger/30'}`}>{f.r}</span>
                                                    <div className="font-black text-lg">{f.r === 'W' ? 'Victoria' : 'Derrota'}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-sm font-black bg-charcoal text-white px-3 py-1 rounded-lg mb-1">{f.m}</div>
                                                    <div className="text-[11px] font-bold opacity-50 uppercase">Round {f.rnd}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {taleOfTape && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/90 backdrop-blur-2xl" onClick={() => setTaleOfTape(null)}>
                            <div className="bg-charcoal text-white rounded-[50px] p-8 md:p-16 w-full max-w-3xl shadow-[0_50px_100px_rgba(0,0,0,0.5)] relative border border-white/10 overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 via-white to-blue-500 opacity-50"></div>
                                <button onClick={() => setTaleOfTape(null)} className="absolute top-10 right-10 text-5xl opacity-30 hover:opacity-100 transition-opacity">&times;</button>
                                
                                <h2 className="text-center text-[11px] font-black tracking-[0.8em] uppercase mb-16 opacity-30">Tale of the Tape</h2>
                                
                                <div className="flex justify-between items-end gap-6 mb-20 relative">
                                    <div className="flex-1 text-center">
                                        <div className="w-24 h-24 md:w-40 md:h-40 mx-auto rounded-full border-4 border-white/10 mb-6 overflow-hidden bg-white/5"><img src={taleOfTape.f1.img || getSilhouette(taleOfTape.f1.name)} className="w-full h-full object-cover" /></div>
                                        <img src={getFlag(taleOfTape.f1.country)} className="w-12 mx-auto mb-4 rounded shadow-xl" />
                                        <div className="text-2xl md:text-4xl font-black mb-1 uppercase tracking-tighter">{taleOfTape.f1.name.split(' ').pop()}</div>
                                        <div className="text-xs font-bold opacity-40">{taleOfTape.f1.rec}</div>
                                    </div>
                                    
                                    <div className="text-xl font-black opacity-10 pb-12 italic tracking-widest">VS</div>
                                    
                                    <div className="flex-1 text-center">
                                        <div className="w-24 h-24 md:w-40 md:h-40 mx-auto rounded-full border-4 border-white/10 mb-6 overflow-hidden bg-white/5"><img src={taleOfTape.f2.img || getSilhouette(taleOfTape.f2.name)} className="w-full h-full object-cover" /></div>
                                        <img src={getFlag(taleOfTape.f2.country)} className="w-12 mx-auto mb-4 rounded shadow-xl" />
                                        <div className="text-2xl md:text-4xl font-black mb-1 uppercase tracking-tighter">{taleOfTape.f2.name.split(' ').pop()}</div>
                                        <div className="text-xs font-bold opacity-40">{taleOfTape.f2.rec}</div>
                                    </div>
                                </div>

                                <div className="space-y-12">
                                    {[ ['EDAD', 'age'], ['ALTURA', 'height'], ['ALCANCE', 'reach'] ].map(([label, key]) => (
                                        <div key={key} className="relative">
                                            <div className="flex justify-between text-2xl md:text-3xl font-black mb-4 px-4">
                                                <span className="text-orange-400">{taleOfTape.f1[key]}</span>
                                                <span className="text-blue-400">{taleOfTape.f2[key]}</span>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[10px] font-black tracking-[0.4em] opacity-20 uppercase whitespace-nowrap">{label}</div>
                                            <div className="h-2 bg-white/5 rounded-full overflow-hidden flex shadow-2xl border border-white/5">
                                                <div className="h-full bg-gradient-to-r from-orange-700 to-orange-400 shadow-[0_0_15px_rgba(251,146,60,0.5)]" style={{width: '50%'}}></div>
                                                <div className="h-full bg-gradient-to-r from-blue-400 to-blue-700 shadow-[0_0_15px_rgba(96,165,250,0.5)]" style={{width: '50%'}}></div>
                                            </div>
                                        </div>
                                    ))}

                                    <div className="grid grid-cols-3 gap-6 pt-10 border-t border-white/5 mt-10">
                                        <div className="text-center bg-white/5 p-5 rounded-3xl"><div className="text-[9px] font-black opacity-30 mb-2 tracking-widest uppercase">KO Artist</div><div className="text-xl font-black text-orange-400">{taleOfTape.f1.ko}% <span className="text-white/20">|</span> <span className="text-blue-400">{taleOfTape.f2.ko}%</span></div></div>
                                        <div className="text-center bg-white/5 p-5 rounded-3xl"><div className="text-[9px] font-black opacity-30 mb-2 tracking-widest uppercase">Submission</div><div className="text-xl font-black text-orange-400">{taleOfTape.f1.sub}% <span className="text-white/20">|</span> <span className="text-blue-400">{taleOfTape.f2.sub}%</span></div></div>
                                        <div className="text-center bg-white/5 p-5 rounded-3xl"><div className="text-[9px] font-black opacity-30 mb-2 tracking-widest uppercase">Decision</div><div className="text-xl font-black text-orange-400">{taleOfTape.f1.dec}% <span className="text-white/20">|</span> <span className="text-blue-400">{taleOfTape.f2.dec}%</span></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

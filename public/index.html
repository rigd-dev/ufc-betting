<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Vegas 116 - Sterling vs Zalal - Betting Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            z-index: 50;
            padding: 8px 0;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        .fight-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            margin: 20px 0;
            padding: 20px;
        }
        .fight-card.with-result {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.05);
        }
        .score-display {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .points-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input, select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.12);
        }
        .fighter-image {
            width: 100%;
            height: 150px;
            background: rgba(100, 100, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 2px solid rgba(100, 150, 255, 0.3);
        }
        .result-badge {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #86efac;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(100, 150, 255, 0.3), transparent);
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = 'https://gxgjlxgmqgcqlesdebzw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zslUYT9DWZTJuhvQ_Uc3ZQ_MszDy0ar';

        const api = {
            async getPredictions() {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/predictions`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },

            async getResults() {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/results`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },

            async savePrediction(fight_id, player, field, value) {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/predictions`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({ fight_id, player, field, value })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            },

            async saveResult(fight_id, field, value) {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/results`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({ fight_id, field, value })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            }
        };

        const UFCApp = () => {
            const [predictions, setPredictions] = useState({});
            const [results, setResults] = useState({});
            const [connected, setConnected] = useState(false);
            const lastUpdateRef = useRef(0);
            const scrollRef = useRef(0);

            const allFights = [
                // PRELIMINARES
                { id: 7, fighter1: 'Talita Alencar', fighter2: 'Julia Polastri', weight: 'Strawweight', round: 3, featured: false, emoji1: '🥊', emoji2: '🥊' },
                { id: 8, fighter1: 'Max Griffin', fighter2: 'Victor Valenzuela', weight: 'Welterweight', round: 3, featured: false, emoji1: '🥊', emoji2: '🥊' },
                { id: 9, fighter1: 'Mayra Bueno Silva', fighter2: 'Michelle Montague', weight: "Women's Bantamweight", round: 3, featured: false, emoji1: '👩‍🦰', emoji2: '👩‍🦰' },
                // MAIN CARD
                { id: 1, fighter1: 'Marcus Almeida', fighter2: 'Ryan Spann', weight: 'Peso Semipesado', round: 3, featured: false, emoji1: '🇧🇷', emoji2: '🇺🇸' },
                { id: 2, fighter1: 'Montel Jackson', fighter2: 'Raoni Barcelos', weight: 'Peso Gallo', round: 3, featured: false, emoji1: '🇺🇸', emoji2: '🇧🇷' },
                { id: 3, fighter1: 'Adrian Luna Martinetti', fighter2: 'Davey Grant', weight: 'Peso Gallo', round: 3, featured: false, emoji1: '🇪🇸', emoji2: '🇬🇧' },
                { id: 4, fighter1: 'Rafa Garcia', fighter2: 'Alexander Hernandez', weight: 'Peso Ligero', round: 3, featured: false, emoji1: '🇪🇸', emoji2: '🇺🇸' },
                { id: 5, fighter1: 'Norma Dumont', fighter2: 'Joselyne Edwards', weight: 'Peso Pluma Femenil', round: 3, featured: false, emoji1: '🇧🇷', emoji2: '🇮🇱' },
                { id: 6, fighter1: 'Aljamain Sterling', fighter2: 'Youssef Zalal', weight: 'Peso Pluma', round: 5, featured: true, emoji1: '🇺🇸', emoji2: '🇨🇦' },
            ];

            // Cargar datos
            useEffect(() => {
                const loadData = async () => {
                    const now = Date.now();
                    if (now - lastUpdateRef.current < 1000) return; // No actualizar más de una vez por segundo
                    lastUpdateRef.current = now;

                    try {
                        const [preds, ress] = await Promise.all([
                            api.getPredictions(),
                            api.getResults()
                        ]);

                        const groupedPreds = {};
                        preds.forEach(pred => {
                            if (!groupedPreds[pred.fight_id]) groupedPreds[pred.fight_id] = {};
                            if (!groupedPreds[pred.fight_id][pred.player]) groupedPreds[pred.fight_id][pred.player] = {};
                            groupedPreds[pred.fight_id][pred.player][pred.field] = pred.value;
                        });
                        setPredictions(prev => {
                            // Merge new data with existing to prevent losing local changes
                            const merged = JSON.parse(JSON.stringify(prev));
                            Object.keys(groupedPreds).forEach(fightId => {
                                if (!merged[fightId]) merged[fightId] = {};
                                Object.keys(groupedPreds[fightId]).forEach(player => {
                                    if (!merged[fightId][player]) merged[fightId][player] = {};
                                    Object.assign(merged[fightId][player], groupedPreds[fightId][player]);
                                });
                            });
                            return merged;
                        });

                        const groupedRes = {};
                        ress.forEach(res => {
                            if (!groupedRes[res.fight_id]) groupedRes[res.fight_id] = {};
                            groupedRes[res.fight_id][res.field] = res.value;
                        });
                        setResults(groupedRes);

                        setConnected(true);
                    } catch (err) {
                        console.error('Error loading data:', err);
                    }
                };

                loadData();
                const interval = setInterval(loadData, 3000); // Increased to 3 seconds
                return () => clearInterval(interval);
            }, []);

            const updatePrediction = async (fightId, player, field, value) => {
                try {
                    scrollRef.current = window.scrollY;
                    await api.savePrediction(fightId, player, field, value);
                    const newPreds = { ...predictions };
                    if (!newPreds[fightId]) newPreds[fightId] = {};
                    if (!newPreds[fightId][player]) newPreds[fightId][player] = {};
                    newPreds[fightId][player][field] = value;
                    setPredictions(newPreds);
                    setTimeout(() => window.scrollTo(0, scrollRef.current), 0);
                } catch (err) {
                    console.error('Error:', err);
                }
            };

            const updateResult = async (fightId, field, value) => {
                try {
                    scrollRef.current = window.scrollY;
                    await api.saveResult(fightId, field, value);
                    const newRes = { ...results };
                    if (!newRes[fightId]) newRes[fightId] = {};
                    newRes[fightId][field] = value;
                    setResults(newRes);
                    setTimeout(() => window.scrollTo(0, scrollRef.current), 0);
                } catch (err) {
                    console.error('Error:', err);
                }
            };

            const calculatePoints = (fightId, player) => {
                const pred = predictions[fightId]?.[player];
                const result = results[fightId];

                if (!pred || !pred.winner || !result || !result.winner) return 0;

                let points = 0;
                if (pred.winner === result.winner) points += 1;
                if (pred.method === result.method) points += 2;
                if (parseInt(pred.round) === parseInt(result.round)) points += 1;

                const fight = allFights.find(f => f.id === fightId);
                if (fight?.featured) return points * 2;
                return points;
            };

            const getTotalScore = (player) => {
                let total = 0;
                allFights.forEach(fight => {
                    total += calculatePoints(fight.id, player);
                });
                return total;
            };

            const getResultText = (fightId) => {
                const result = results[fightId];
                if (!result?.winner) return null;
                return `${result.winner} - ${result.method}${result.round && result.round !== 'final' ? ` (R${result.round})` : ' (Final)'}`;
            };

            // Ordenar peleas: sin resultado primero, con resultado al final
            const sortedFights = [...allFights].sort((a, b) => {
                const aHasResult = !!getResultText(a.id);
                const bHasResult = !!getResultText(b.id);
                return aHasResult - bHasResult;
            });

            return (
                <div className="min-h-screen text-white pb-20">
                    {/* STICKY HEADER CON MARCADOR */}
                    <div className="sticky-header">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="text-center mb-2">
                                <h1 className="text-xl font-black mb-0">🥊 UFC VEGAS 116</h1>
                                <p className="text-xs text-yellow-300">Sterling vs Zalal</p>
                            </div>

                            {/* RESULTADO OFICIAL */}
                            <div className="bg-gradient-to-r from-purple-900 to-blue-900 p-3 rounded-lg text-center">
                                <p className="text-xs text-gray-300 mb-1">RESULTADO</p>
                                <div className="flex justify-around items-center">
                                    <div>
                                        <p className="text-sm font-bold">Papá</p>
                                        <div className="score-display text-2xl">{getTotalScore('player1')}</div>
                                        <div className="text-xs text-gray-400">pts</div>
                                    </div>
                                    <div className="text-xl text-gray-400">vs</div>
                                    <div>
                                        <p className="text-sm font-bold">Hijo</p>
                                        <div className="score-display text-2xl">{getTotalScore('player2')}</div>
                                        <div className="text-xs text-gray-400">pts</div>
                                    </div>
                                </div>
                                <div className="flex justify-center items-center gap-3 mt-2">
                                    <p className="text-xs text-gray-400">🟢 {connected ? 'Sincronizado' : 'Conectando...'}</p>
                                    <button className="refresh-btn" onClick={() => window.location.reload()}>🔄 Refresh</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* PELEAS */}
                    <div className="max-w-7xl mx-auto px-4">
                        {sortedFights.map((fight, idx) => (
                            <div key={fight.id}>
                                <div className={`fight-card ${getResultText(fight.id) ? 'with-result' : ''}`}>
                                    {fight.featured && (
                                        <div className="bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-4 py-2 rounded-full text-sm font-bold mb-4 inline-block">
                                            ⭐ PELEA ESTELAR (2x PUNTOS)
                                        </div>
                                    )}

                                    {/* HEADER CON NOMBRES */}
                                    <div className="flex items-center justify-between mb-6 pb-4 border-b border-gray-700">
                                        <div className="text-center flex-1">
                                            <p className="text-xl font-bold">{fight.fighter1}</p>
                                            <p className="text-sm text-gray-400">{fight.weight}</p>
                                        </div>
                                        <div className="px-6 text-center">
                                            <p className="text-gray-500">vs</p>
                                            <p className="text-sm text-gray-500">{fight.round} Rounds</p>
                                        </div>
                                        <div className="text-center flex-1">
                                            <p className="text-xl font-bold">{fight.fighter2}</p>
                                        </div>
                                    </div>

                                    {/* RESULTADO INGRESADO */}
                                    {getResultText(fight.id) && (
                                        <div className="mb-6 p-4 bg-green-900/20 border-l-4 border-green-500 rounded">
                                            <p className="text-green-300 font-bold">✓ {getResultText(fight.id)}</p>
                                        </div>
                                    )}

                                    {/* SECCIÓN PARA INGRESAR RESULTADO */}
                                    <div className={`p-4 rounded mb-6 border-l-4 ${getResultText(fight.id) ? 'bg-green-900/10 border-green-500' : 'bg-orange-900/10 border-orange-500'}`}>
                                        <h4 className={`font-bold mb-3 ${getResultText(fight.id) ? 'text-green-300' : 'text-orange-300'}`}>
                                            {getResultText(fight.id) ? 'Puedes cambiar el resultado' : 'Ingresar Resultado'}
                                        </h4>
                                        <div className="grid grid-cols-3 gap-3">
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-2">GANADOR</label>
                                                <select
                                                    value={results[fight.id]?.winner || ''}
                                                    onChange={(e) => updateResult(fight.id, 'winner', e.target.value)}
                                                >
                                                    <option value="">Selecciona...</option>
                                                    <option value={fight.fighter1}>{fight.fighter1}</option>
                                                    <option value={fight.fighter2}>{fight.fighter2}</option>
                                                    <option value="Empate">Empate</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-2">MÉTODO</label>
                                                <select
                                                    value={results[fight.id]?.method || ''}
                                                    onChange={(e) => updateResult(fight.id, 'method', e.target.value)}
                                                >
                                                    <option value="">Selecciona...</option>
                                                    <option value="Decisión">Decisión</option>
                                                    <option value="KO/TKO">KO/TKO</option>
                                                    <option value="Sumisión">Sumisión</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-2">ROUND</label>
                                                <select
                                                    value={results[fight.id]?.round || ''}
                                                    onChange={(e) => updateResult(fight.id, 'round', e.target.value)}
                                                >
                                                    <option value="">Selecciona...</option>
                                                    {Array.from({length: fight.round}, (_, i) => (
                                                        <option key={i+1} value={i+1}>Round {i+1}</option>
                                                    ))}
                                                    {results[fight.id]?.method === 'Decisión' && (
                                                        <option value="final">Decisión Final</option>
                                                    )}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* PREDICCIONES */}
                                    <div className="grid grid-cols-2 gap-6">
                                        {/* PAPÁ */}
                                        <div className="bg-blue-900/10 border-l-4 border-blue-500 p-4 rounded">
                                            <h4 className="font-bold text-blue-300 mb-4">PAPÁ</h4>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Ganador</label>
                                                    <select
                                                        value={predictions[fight.id]?.player1?.winner || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player1', 'winner', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value={fight.fighter1}>{fight.fighter1}</option>
                                                        <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        <option value="Empate">Empate</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Método</label>
                                                    <select
                                                        value={predictions[fight.id]?.player1?.method || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player1', 'method', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value="Decisión">Decisión</option>
                                                        <option value="KO/TKO">KO/TKO</option>
                                                        <option value="Sumisión">Sumisión</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Round</label>
                                                    <select
                                                        value={predictions[fight.id]?.player1?.round || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player1', 'round', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        {Array.from({length: fight.round}, (_, i) => (
                                                            <option key={i+1} value={i+1}>Round {i+1}</option>
                                                        ))}
                                                        {predictions[fight.id]?.player1?.method === 'Decisión' && (
                                                            <option value="final">Decisión Final</option>
                                                        )}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="points-badge mt-4 w-full text-center">
                                                {calculatePoints(fight.id, 'player1')} {fight.featured ? '(×2)' : ''} pts
                                            </div>
                                        </div>

                                        {/* HIJO */}
                                        <div className="bg-red-900/10 border-l-4 border-red-500 p-4 rounded">
                                            <h4 className="font-bold text-red-300 mb-4">HIJO</h4>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Ganador</label>
                                                    <select
                                                        value={predictions[fight.id]?.player2?.winner || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player2', 'winner', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value={fight.fighter1}>{fight.fighter1}</option>
                                                        <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        <option value="Empate">Empate</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Método</label>
                                                    <select
                                                        value={predictions[fight.id]?.player2?.method || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player2', 'method', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value="Decisión">Decisión</option>
                                                        <option value="KO/TKO">KO/TKO</option>
                                                        <option value="Sumisión">Sumisión</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 block mb-1">Round</label>
                                                    <select
                                                        value={predictions[fight.id]?.player2?.round || ''}
                                                        onChange={(e) => updatePrediction(fight.id, 'player2', 'round', e.target.value)}
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        {Array.from({length: fight.round}, (_, i) => (
                                                            <option key={i+1} value={i+1}>Round {i+1}</option>
                                                        ))}
                                                        {predictions[fight.id]?.player2?.method === 'Decisión' && (
                                                            <option value="final">Decisión Final</option>
                                                        )}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="points-badge mt-4 w-full text-center">
                                                {calculatePoints(fight.id, 'player2')} {fight.featured ? '(×2)' : ''} pts
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {idx < sortedFights.length - 1 && <div className="divider"></div>}
                            </div>
                        ))}
                    </div>

                    <div className="text-center text-gray-600 text-sm py-10">
                        <p>✨ Apuestas de UFC con Supabase en tiempo real ✨</p>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Perth - Marcador Premium</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F6F5F0',
                        charcoal: '#1A1A1A',
                        secondary: '#666666',
                        accentWarm: '#FF6B00',
                        accentCool: '#0055FF',
                        success: '#00C853',
                        danger: '#FF1744'
                    },
                    fontFamily: {
                        sans: ['Sora', 'sans-serif'],
                        serif: ['EB Garamond', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F6F5F0;
            color: #1A1A1A;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(217,100%,60%,0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 12px 40px 0 rgba(26, 26, 26, 0.06);
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(246, 245, 240, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(26, 26, 26, 0.05);
            padding: 12px 0;
        }
        .score-warm { background: linear-gradient(135deg, #FF6B00, #FFB800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .score-cool { background: linear-gradient(135deg, #0055FF, #00C3FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .leader-glow-warm { box-shadow: 0 0 30px rgba(255, 107, 0, 0.4); border-color: rgba(255, 107, 0, 0.5); }
        .leader-glow-cool { box-shadow: 0 0 30px rgba(0, 85, 255, 0.4); border-color: rgba(0, 85, 255, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const api = {
            async getPredictions() { const r = await fetch('/api/predictions'); return r.json(); },
            async getResults() { const r = await fetch('/api/results'); return r.json(); },
            async savePrediction(fight_id, player, field, value) {
                return fetch('/api/predictions', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fight_id, player, field, value}) });
            },
            async saveResult(fight_id, field, value) {
                return fetch('/api/results', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fight_id, field, value}) });
            },
            async clearAll() { await fetch('/api/predictions', { method: 'DELETE' }); await fetch('/api/results', { method: 'DELETE' }); },
            async saveConfirmed(fight_id) { return fetch('/api/confirmed', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fight_id}) }); },
            async unconfirm(fight_id) { return fetch(`/api/results?fight_id=${fight_id}&field=confirmed`, { method: 'DELETE' }); },
            async fetchGeminiResults() { const r = await fetch('/api/gemini-update', { method: 'POST' }); return r.json(); }
        };

        const UFCApp = () => {
            const [predictions, setPredictions] = useState({});
            const [results, setResults] = useState({});
            const [confirmedResults, setConfirmedResults] = useState({});
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState('');
            const [modalFighter, setModalFighter] = useState(null);
            const [taleOfTape, setTaleOfTape] = useState(null);
            const [activeTab, setActiveTab] = useState('Preliminar');
            const [activeFightId, setActiveFightId] = useState(1);

            const allFights = [
                // PRELIMS (Peleas 1-7)
                { id: 1, type: 'Preliminar', round: 3, weight: 'Peso Ligero',
                    f1: { name: 'Dom Mar Fan', country: 'au', age: 25, height: '178cm', reach: '183cm', rec: '6-1-0', odds: '+150', oddsType: 'Underdog', img: '', style: 'MMA', specialty: 'Striking', recent: [{r:'W', m:'Decisión', rnd:3}, {r:'W', m:'KO/TKO', rnd:1}] },
                    f2: { name: 'Kody Steele', country: 'us', age: 29, height: '175cm', reach: '175cm', rec: '6-0-0', odds: '-180', oddsType: 'Favorito', img: '', style: 'Grappler', specialty: 'Presión', recent: [{r:'W', m:'KO/TKO', rnd:2}, {r:'W', m:'Decisión', rnd:3}] }
                },
                { id: 2, type: 'Preliminar', round: 3, weight: 'Peso Wélter',
                    f1: { name: 'Jonathan Micallef', country: 'au', age: 26, height: '180cm', reach: '183cm', rec: '6-1-0', odds: '+245', oddsType: 'Underdog', img: '', style: 'Striker', specialty: 'Movimiento', recent: [{r:'W', m:'KO/TKO', rnd:2}] },
                    f2: { name: 'Themba Gorimbo', country: 'zw', age: 33, height: '185cm', reach: '196cm', rec: '13-4-0', odds: '-300', oddsType: 'Favorito', img: '', style: 'Grappler', specialty: 'Alcance', recent: [{r:'W', m:'Decisión', rnd:3}, {r:'W', m:'KO/TKO', rnd:1}] }
                },
                { id: 3, type: 'Preliminar', round: 3, weight: 'Peso Medio',
                    f1: { name: 'Ben Johnston', country: 'au', age: 32, height: '185cm', reach: '191cm', rec: '6-1-0', odds: '+485', oddsType: 'Underdog', img: '', style: 'Brawler', specialty: 'Corazón', recent: [{r:'W', m:'Decisión', rnd:3}] },
                    f2: { name: 'Mes Schultz', country: 'us', age: 27, height: '191cm', reach: '193cm', rec: '7-1-0', odds: '-650', oddsType: 'Favorito', img: '', style: 'Striker', specialty: 'Poder', recent: [{r:'W', m:'KO/TKO', rnd:1}] }
                },
                { id: 4, type: 'Preliminar', round: 3, weight: 'Peso Gallo',
                    f1: { name: 'Cody Thicknesse', country: 'au', age: 24, height: '173cm', reach: '175cm', rec: '5-0-0', odds: '+340', oddsType: 'Underdog', img: '', style: 'MMA', specialty: 'Juventud', recent: [{r:'W', m:'Sumisión', rnd:1}] },
                    f2: { name: 'Vince Morales', country: 'us', age: 33, height: '170cm', reach: '178cm', rec: '16-7-0', odds: '-440', oddsType: 'Favorito', img: '', style: 'Boxeador', specialty: 'Experiencia', recent: [{r:'W', m:'Decisión', rnd:3}, {r:'W', m:'KO/TKO', rnd:2}] }
                },
                { id: 5, type: 'Preliminar', round: 3, weight: 'Peso Medio',
                    f1: { name: 'Jacob Malkoun', country: 'au', age: 29, height: '175cm', reach: '183cm', rec: '8-3-0', odds: '+400', oddsType: 'Underdog', img: '', style: 'Grappler', specialty: 'Control', recent: [{r:'W', m:'KO/TKO', rnd:2}, {r:'L', m:'DQ', rnd:3}] },
                    f2: { name: 'Gerald Meerschaert', country: 'us', age: 36, height: '185cm', reach: '196cm', rec: '36-17-0', odds: '-1000', oddsType: 'Favorito', img: '', style: 'BJJ', specialty: 'Sumisiones', recent: [{r:'W', m:'Sumisión', rnd:2}, {r:'W', m:'Sumisión', rnd:1}] }
                },
                { id: 6, type: 'Preliminar', round: 3, weight: 'Peso Completo',
                    f1: { name: 'Junior Tafa', country: 'au', age: 27, height: '191cm', reach: '191cm', rec: '5-3-0', odds: '+205', oddsType: 'Underdog', img: '', style: 'Striker', specialty: 'Poder', recent: [{r:'L', m:'KO/TKO', rnd:2}, {r:'W', m:'KO/TKO', rnd:1}] },
                    f2: { name: 'Kevin Christian', country: 'br', age: 29, height: '193cm', reach: '201cm', rec: '10-2-0', odds: '-245', oddsType: 'Favorito', img: '', style: 'BJJ', specialty: 'Largo', recent: [{r:'W', m:'Sumisión', rnd:1}] }
                },
                { id: 7, type: 'Preliminar', round: 3, weight: 'Peso Medio',
                    f1: { name: 'Dan Rowston', country: 'au', age: 30, height: '183cm', reach: '188cm', rec: '8-2-0', odds: '+175', oddsType: 'Underdog', img: '', style: 'MMA', specialty: 'Completo', recent: [{r:'W', m:'Decisión', rnd:3}] },
                    f2: { name: 'Robert Bryczek', country: 'pl', age: 33, height: '183cm', reach: '185cm', rec: '17-6-0', odds: '-210', oddsType: 'Favorito', img: '', style: 'Striker', specialty: 'Poder', recent: [{r:'L', m:'Decisión', rnd:3}] }
                },

                // ESTELARES (Peleas 8-13)
                { id: 8, type: 'Estelar', round: 3, weight: 'Peso Completo',
                    f1: { name: 'Tai Tuivasa', country: 'au', age: 31, height: '188cm', reach: '191cm', rec: '15-7-0', odds: '+220', oddsType: 'Underdog', img: '', style: 'Brawler', specialty: 'KO Power', recent: [{r:'L', m:'Sumisión', rnd:1}, {r:'L', m:'KO/TKO', rnd:2}] },
                    f2: { name: 'Louie Sutherland', country: 'gb', age: 28, height: '191cm', reach: '193cm', rec: '6-3-0', odds: '-270', oddsType: 'Favorito', img: '', style: 'Striker', specialty: 'Agresión', recent: [{r:'W', m:'KO/TKO', rnd:1}] }
                },
                { id: 9, type: 'Estelar', round: 3, weight: 'Peso Completo',
                    f1: { name: 'Shamil Gaziev', country: 'bh', age: 34, height: '193cm', reach: '201cm', rec: '13-1-0', odds: '-230', oddsType: 'Favorito', img: '', style: 'Wrestling', specialty: 'GnP', recent: [{r:'W', m:'Decisión', rnd:3}] },
                    f2: { name: 'Brando Pericic', country: 'au', age: 27, height: '185cm', reach: '191cm', rec: '8-1-0', odds: '+190', oddsType: 'Underdog', img: '', style: 'Striker', specialty: 'Gancho', recent: [{r:'W', m:'KO/TKO', rnd:1}] }
                },
                { id: 10, type: 'Estelar', round: 3, weight: 'Peso Pluma',
                    f1: { name: 'Marwan Rahiki', country: 'au', age: 26, height: '175cm', reach: '178cm', rec: '9-2-0', odds: '-650', oddsType: 'Favorito', img: '', style: 'Grappler', specialty: 'Chokes', recent: [{r:'W', m:'Sumisión', rnd:2}] },
                    f2: { name: 'Ollie Schmid', country: 'au', age: 25, height: '178cm', reach: '183cm', rec: '7-1-0', odds: '+485', oddsType: 'Underdog', img: '', style: 'Kickboxer', specialty: 'Kicks', recent: [{r:'W', m:'KO/TKO', rnd:3}] }
                },
                { id: 11, type: 'Estelar', round: 3, weight: 'Peso Mosca',
                    f1: { name: 'Tim Elliott', country: 'us', age: 37, height: '170cm', reach: '168cm', rec: '20-13-1', odds: '+155', oddsType: 'Underdog', img: '', style: 'Luchador', specialty: 'Cardio', recent: [{r:'W', m:'Decisión', rnd:3}] },
                    f2: { name: 'Steve Erceg', country: 'au', age: 28, height: '173cm', reach: '174cm', rec: '12-3-0', odds: '-185', oddsType: 'Favorito', img: '', style: 'Boxeador', specialty: 'Precisión', recent: [{r:'L', m:'Decisión', rnd:5}] }
                },
                { id: 12, type: 'Estelar', round: 3, weight: 'Peso Ligero',
                    f1: { name: 'Beneil Dariush', country: 'us', age: 35, height: '178cm', reach: '183cm', rec: '22-6-1', odds: '-350', oddsType: 'Favorito', img: '', style: 'BJJ', specialty: 'Control', recent: [{r:'L', m:'KO/TKO', rnd:1}] },
                    f2: { name: 'Quillan Salkilld', country: 'au', age: 24, height: '183cm', reach: '188cm', rec: '7-1-0', odds: '+280', oddsType: 'Underdog', img: '', style: 'MMA', specialty: 'Completo', recent: [{r:'W', m:'Sumisión', rnd:2}] }
                },
                { id: 13, type: 'Estelar', round: 5, weight: 'Peso Wélter', featured: true,
                    f1: { name: 'Jack Della Maddalena', country: 'au', age: 29, height: '180cm', reach: '185cm', rec: '18-3-0', odds: '-135', oddsType: 'Favorito', img: '', style: 'Boxeador', specialty: 'Presión', recent: [{r:'W', m:'KO/TKO', rnd:3}] },
                    f2: { name: 'Carlos Prates', country: 'br', age: 30, height: '185cm', reach: '198cm', rec: '23-7-0', odds: '+115', oddsType: 'Underdog', img: '', style: 'Muay Thai', specialty: 'KOs', recent: [{r:'W', m:'KO/TKO', rnd:2}] }
                }
            ];

            useEffect(() => {
                const load = async () => {
                    const [preds, ress] = await Promise.all([api.getPredictions(), api.getResults()]);
                    const pMap = {}, rMap = {}, cMap = {};
                    preds.forEach(p => { if(!pMap[p.fight_id]) pMap[p.fight_id]={}; if(!pMap[p.fight_id][p.player]) pMap[p.fight_id][p.player]={}; pMap[p.fight_id][p.player][p.field] = p.value; });
                    ress.forEach(r => { if(!rMap[r.fight_id]) rMap[r.fight_id]={}; if(r.field==='confirmed') cMap[r.fight_id]=true; else rMap[r.fight_id][r.field] = r.value; });
                    setPredictions(pMap); setResults(rMap); setConfirmedResults(cMap);
                };
                load();
            }, []);

            const handlePred = (id, pl, f, v) => { setPredictions(prev => ({...prev, [id]: {...prev[id], [pl]: {...(prev[id]?.[pl]||{}), [f]: v}}})); api.savePrediction(id, pl, f, v); };
            const handleRes = (id, f, v) => { setResults(prev => ({...prev, [id]: {...(prev[id]||{}), [f]: v}})); api.saveResult(id, f, v); };
            const calcPts = (id, pl) => {
                const p = predictions[id]?.[pl], r = results[id];
                if (!p?.winner || !r?.winner || !confirmedResults[id]) return 0;
                let pts = 0;
                if (p.winner === r.winner) pts += 1;
                if (p.method === r.method) pts += 1;
                if (p.round == r.round || (p.round === 'final' && r.round === 'final')) pts += 1;
                return allFights.find(f => f.id === id)?.featured ? pts * 2 : pts;
            };

            const getWeightLbs = (weight) => {
                const map = { 'Peso Mosca': '125.0 lbs', 'Peso Paja Femenino': '115.0 lbs', 'Peso Gallo': '135.0 lbs', 'Peso Pluma': '145.0 lbs', 'Peso Ligero': '155.0 lbs', 'Peso Wélter': '170.0 lbs', 'Peso Medio': '185.0 lbs', 'Peso Semicompleto': '205.0 lbs', 'Peso Completo': '265.0 lbs' };
                return map[weight] || '';
            };

            const getSilhouette = (name) => `https://ui-avatars.com/api/?name=${name.replace(' ', '+')}&background=EAEAEA&color=1A1A1A&size=256&font-size=0.33&bold=true`;
            const getFlag = (code) => `https://flagcdn.com/w40/${code.toLowerCase()}.png`;

            const papaScore = allFights.reduce((acc, f) => acc + calcPts(f.id, 'player1'), 0);
            const hijoScore = allFights.reduce((acc, f) => acc + calcPts(f.id, 'player2'), 0);

            const filteredFights = allFights.filter(f => f.type === activeTab);
            const currentFight = allFights.find(f => f.id === activeFightId);

            return (
                <div className="min-h-screen pb-32 relative">
                    <div className="sticky-header">
                        <div className="max-w-4xl mx-auto px-4 flex justify-between items-center gap-4">
                            <h1 className="text-lg md:text-3xl font-black uppercase tracking-tight">🥊 UFC PERTH</h1>
                            <div className={`bg-white/80 p-2 px-4 md:px-8 rounded-2xl border-2 flex gap-4 md:gap-12 ${papaScore > hijoScore ? 'leader-glow-warm' : hijoScore > papaScore ? 'leader-glow-cool' : 'border-white shadow-xl'}`}>
                                <div className="text-center"><div className="text-[10px] font-black uppercase opacity-50">Papá {papaScore > hijoScore && '👑'}</div><div className="text-2xl md:text-5xl font-black score-warm leading-none">{papaScore}</div></div>
                                <div className="w-px bg-charcoal/10"></div>
                                <div className="text-center"><div className="text-[10px] font-black uppercase opacity-50">Hijo {hijoScore > papaScore && '👑'}</div><div className="text-2xl md:text-5xl font-black score-cool leading-none">{hijoScore}</div></div>
                            </div>
                            <button onClick={() => setShowLogin(true)} className="hidden md:block text-xs font-semibold px-4 py-2 bg-charcoal text-cream rounded-lg">{isAdmin ? 'Admin ✅' : 'Admin'}</button>
                        </div>
                    </div>

                    <div className="max-w-3xl mx-auto px-4 mt-8">
                        <div className="flex gap-2 mb-8 bg-charcoal/5 p-1 rounded-2xl">
                            {['Preliminar', 'Estelar'].map(t => (
                                <button key={t} onClick={() => { setActiveTab(t); setActiveFightId(allFights.find(f => f.type === t).id); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition ${activeTab === t ? 'bg-charcoal text-cream shadow-lg' : 'hover:bg-charcoal/5'}`}>
                                    {t === 'Estelar' ? 'Cartelera Estelar' : 'Preliminares'}
                                </button>
                            ))}
                        </div>

                        <div className="flex overflow-x-auto gap-2 mb-8 pb-2 custom-scrollbar">
                            {filteredFights.map(f => (
                                <button key={f.id} onClick={() => setActiveFightId(f.id)} className={`px-5 py-2 rounded-full font-black text-[11px] uppercase border transition ${activeFightId === f.id ? 'bg-charcoal text-cream border-charcoal' : 'bg-white border-charcoal/10 hover:border-charcoal/30'}`}>
                                    Pelea {f.id}
                                </button>
                            ))}
                        </div>

                        {currentFight && (
                            <div className="glass-panel p-6 md:p-12 relative animate-fade-in">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-charcoal text-cream text-[10px] font-black uppercase tracking-widest px-6 py-2 rounded-full border-4 border-white shadow-xl">
                                    {currentFight.type} {currentFight.featured && '• 2x Puntos'}
                                </div>

                                <div className="flex justify-between items-center mb-12 mt-4 gap-2">
                                    <div className="flex-1 text-center group cursor-pointer" onClick={() => setModalFighter(currentFight.f1)}>
                                        <div className="relative inline-block mb-4">
                                            <div className="w-24 h-24 sm:w-32 sm:h-32 md:w-48 md:h-48 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white/50"><img src={getSilhouette(currentFight.f1.name)} className="w-full h-full object-cover" /></div>
                                            <img src={getFlag(currentFight.f1.country)} className="absolute bottom-1 right-1 w-8 h-8 md:w-14 md:h-14 border-4 border-white rounded-full shadow-lg" />
                                        </div>
                                        <h3 className="text-sm md:text-3xl font-black mb-1 leading-tight">{currentFight.f1.name}</h3>
                                        <div className="text-[10px] font-black px-2 py-0.5 rounded-full bg-charcoal/5 inline-block">{currentFight.f1.odds}</div>
                                    </div>

                                    <div className="flex flex-col items-center gap-3">
                                        <button onClick={() => setTaleOfTape(currentFight)} className="w-10 h-10 md:w-14 md:h-14 bg-charcoal/5 hover:bg-charcoal text-charcoal hover:text-white rounded-full transition flex items-center justify-center border border-charcoal/10 shadow-sm text-lg md:text-2xl">📊</button>
                                        <div className="text-xl md:text-5xl font-black opacity-10">VS</div>
                                        <div className="text-center space-y-1">
                                            <div className="text-[9px] md:text-[11px] font-black bg-white px-3 py-1 rounded-full border border-charcoal/10 shadow-sm uppercase">{currentFight.weight}</div>
                                            <div className="text-[9px] md:text-[11px] font-black bg-charcoal text-white px-3 py-1 rounded-full shadow-md uppercase">{currentFight.round} RNDS</div>
                                        </div>
                                    </div>

                                    <div className="flex-1 text-center group cursor-pointer" onClick={() => setModalFighter(currentFight.f2)}>
                                        <div className="relative inline-block mb-4">
                                            <div className="w-24 h-24 sm:w-32 sm:h-32 md:w-48 md:h-48 rounded-full border-4 border-white shadow-2xl overflow-hidden bg-white/50"><img src={getSilhouette(currentFight.f2.name)} className="w-full h-full object-cover" /></div>
                                            <img src={getFlag(currentFight.f2.country)} className="absolute bottom-1 right-1 w-8 h-8 md:w-14 md:h-14 border-4 border-white rounded-full shadow-lg" />
                                        </div>
                                        <h3 className="text-sm md:text-3xl font-black mb-1 leading-tight">{currentFight.f2.name}</h3>
                                        <div className="text-[10px] font-black px-2 py-0.5 rounded-full bg-charcoal/5 inline-block">{currentFight.f2.odds}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {['player1', 'player2'].map((p, i) => (
                                        <div key={p} className={`p-6 rounded-3xl border-2 transition-all ${i === 0 ? 'bg-orange-50 border-orange-100 hover:border-orange-300' : 'bg-blue-50 border-blue-100 hover:border-blue-300'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className={`text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-md ${i === 0 ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{i === 0 ? 'Pick Papá' : 'Pick Hijo'}</span>
                                                {confirmedResults[currentFight.id] && <span className="text-xs font-black bg-white px-3 py-1 rounded-lg border border-charcoal/5 shadow-sm text-success">+{calcPts(currentFight.id, p)} pts</span>}
                                            </div>
                                            <select className="w-full bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-sm font-bold mb-3 focus:ring-2 focus:ring-charcoal/20" value={predictions[currentFight.id]?.[p]?.winner || ''} onChange={e => handlePred(currentFight.id, p, 'winner', e.target.value)}>
                                                <option value="" disabled>Ganador...</option>
                                                <option value={currentFight.f1.name}>{currentFight.f1.name}</option>
                                                <option value={currentFight.f2.name}>{currentFight.f2.name}</option>
                                            </select>
                                            <div className="flex gap-2">
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-xs font-bold" value={predictions[currentFight.id]?.[p]?.method || ''} onChange={e => handlePred(currentFight.id, p, 'method', e.target.value)}><option value="" disabled>Método</option><option value="Decisión">Decisión</option><option value="KO/TKO">KO/TKO</option><option value="Sumisión">Sumisión</option></select>
                                                <select className="flex-1 bg-white border border-charcoal/10 rounded-xl px-4 py-3 text-xs font-bold" value={predictions[currentFight.id]?.[p]?.round || ''} onChange={e => handlePred(currentFight.id, p, 'round', e.target.value)}><option value="" disabled>Round</option>{Array.from({length: currentFight.round}, (_, i) => <option key={i+1} value={i+1}>R{i+1}</option>)}<option value="final">Final</option></select>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {isAdmin && (
                                    <div className="mt-12 pt-8 border-t-2 border-dashed border-charcoal/10 flex flex-wrap gap-4 items-center justify-center">
                                        <select className="bg-white border-2 border-charcoal/10 rounded-xl px-4 py-2 text-xs font-black" value={results[currentFight.id]?.winner || ''} onChange={e => handleRes(currentFight.id, 'winner', e.target.value)} disabled={confirmedResults[currentFight.id]}><option value="">RESULTADO OFICIAL...</option><option value={currentFight.f1.name}>{currentFight.f1.name}</option><option value={currentFight.f2.name}>{currentFight.f2.name}</option></select>
                                        <button onClick={() => { setConfirmedResults(p=>({...p,[currentFight.id]:!p[currentFight.id]})); confirmedResults[currentFight.id] ? api.unconfirm(currentFight.id) : api.saveConfirmed(currentFight.id); }} className={`px-8 py-2 rounded-xl text-xs font-black uppercase transition shadow-md ${confirmedResults[currentFight.id] ? 'bg-charcoal text-white' : 'bg-success text-white'}`}>{confirmedResults[currentFight.id] ? '🔓 Editar' : '🔒 Confirmar'}</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {modalFighter && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/60 backdrop-blur-md" onClick={() => setModalFighter(null)}>
                            <div className="bg-cream/90 backdrop-blur-2xl rounded-[40px] p-8 md:p-12 w-full max-w-xl shadow-2xl border border-white relative max-h-[90vh] overflow-y-auto custom-scrollbar flex flex-col" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setModalFighter(null)} className="absolute top-8 right-8 text-4xl hover:rotate-90 transition-transform">&times;</button>
                                <div className="flex items-center gap-6 mb-8"><div className="w-24 h-24 md:w-32 md:h-32 rounded-full overflow-hidden border-4 border-white shadow-xl bg-white"><img src={getSilhouette(modalFighter.name)} className="w-full h-full object-cover" /></div><div><h2 className="text-3xl md:text-5xl font-black mb-1 uppercase tracking-tight">{modalFighter.name}</h2><div className="flex items-center gap-2"><img src={getFlag(modalFighter.country)} className="w-8 rounded-sm shadow-sm" /><span className="text-lg font-serif italic text-secondary">{modalFighter.rec}</span></div></div></div>
                                <div className="grid grid-cols-2 gap-4 mb-8"><div className="bg-white/60 p-5 rounded-3xl border border-white"><div className="text-[10px] font-black uppercase mb-1 opacity-50">Estilo</div><div className="font-bold">{modalFighter.style}</div></div><div className="bg-white/60 p-5 rounded-3xl border border-white"><div className="text-[10px] font-black uppercase mb-1 opacity-50">Especialidad</div><div className="font-bold">{modalFighter.specialty}</div></div></div>
                                <div className="space-y-4 pr-2 overflow-y-auto custom-scrollbar">
                                    <div className="text-xs font-black uppercase tracking-widest border-b pb-2 opacity-50">Historial Reciente</div>
                                    {modalFighter.recent.map((f, i) => (
                                        <div key={i} className="flex justify-between items-center"><div className="flex items-center gap-4"><span className={`w-10 h-10 flex items-center justify-center font-black rounded-full text-sm border-2 ${f.r === 'W' ? 'bg-success/10 text-success border-success/20' : 'bg-danger/10 text-danger border-danger/20'}`}>{f.r}</span><span className="font-bold text-sm">{f.r === 'W' ? 'Victoria' : 'Derrota'}</span></div><div className="text-right"><div className="text-xs font-black">{f.m}</div><div className="text-[10px] opacity-50">RND {f.rnd}</div></div></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {taleOfTape && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-charcoal/80 backdrop-blur-xl" onClick={() => setTaleOfTape(null)}>
                            <div className="bg-charcoal text-white rounded-[40px] p-8 md:p-12 w-full max-w-2xl shadow-2xl relative border border-white/10" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setTaleOfTape(null)} className="absolute top-8 right-8 text-4xl opacity-50 hover:opacity-100">&times;</button>
                                <h2 className="text-center text-[10px] font-black tracking-[0.6em] uppercase mb-16 opacity-30">Tale of the Tape</h2>
                                <div className="flex justify-between items-end gap-4 mb-12">
                                    <div className="flex-1 text-center"><img src={getFlag(taleOfTape.f1.country)} className="w-10 mx-auto mb-4 rounded shadow-lg" /><div className="text-xl md:text-3xl font-black mb-1">{taleOfTape.f1.name.split(' ').pop()}</div><div className="text-[10px] opacity-40 uppercase">{taleOfTape.f1.rec}</div></div>
                                    <div className="text-xs font-black opacity-10 pb-4">VERSUS</div>
                                    <div className="flex-1 text-center"><img src={getFlag(taleOfTape.f2.country)} className="w-10 mx-auto mb-4 rounded shadow-lg" /><div className="text-xl md:text-3xl font-black mb-1">{taleOfTape.f2.name.split(' ').pop()}</div><div className="text-[10px] opacity-40 uppercase">{taleOfTape.f2.rec}</div></div>
                                </div>
                                <div className="space-y-10">
                                    {[ ['EDAD', 'age'], ['ALTURA', 'height'], ['ALCANCE', 'reach'] ].map(([label, key]) => (
                                        <div key={key} className="relative group">
                                            <div className="flex justify-between text-xl md:text-2xl font-black mb-3 px-2"><span>{taleOfTape.f1[key]}</span><span>{taleOfTape.f2[key]}</span></div>
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[9px] font-black tracking-widest opacity-20 uppercase">{label}</div>
                                            <div className="h-1.5 bg-white/5 rounded-full overflow-hidden flex shadow-inner">
                                                <div className="h-full bg-gradient-to-r from-orange-600 to-orange-400 shadow-lg" style={{width: '50%'}}></div>
                                                <div className="h-full bg-gradient-to-r from-blue-400 to-blue-600 shadow-lg" style={{width: '50%'}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogin && (
                        <div className="fixed inset-0 bg-charcoal/60 backdrop-blur-md flex items-center justify-center z-[200] p-4" onClick={() => setShowLogin(false)}>
                            <div className="bg-cream p-8 rounded-[32px] w-full max-w-sm shadow-2xl border border-white relative" onClick={e => e.stopPropagation()}>
                                <h2 className="font-black uppercase tracking-tight text-3xl mb-1 text-center">Admin Access</h2>
                                <p className="text-[10px] font-black text-secondary text-center mb-8 uppercase tracking-widest">Autenticación necesaria</p>
                                <input type="password" placeholder="Contraseña..." className="w-full mb-6 bg-white border-2 border-charcoal/5 focus:border-charcoal rounded-2xl px-5 py-4 text-sm font-bold transition-all" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && (password === 'ufc2026' ? (setIsAdmin(true), setShowLogin(false), setPassword('')) : alert('Incorrecto'))} />
                                <div className="flex gap-3"><button className="flex-1 bg-white border-2 border-charcoal/5 font-black py-4 rounded-2xl text-xs uppercase" onClick={() => setShowLogin(false)}>Cancelar</button><button className="flex-1 bg-charcoal text-white font-black py-4 rounded-2xl text-xs uppercase shadow-lg" onClick={() => password === 'ufc2026' ? (setIsAdmin(true), setShowLogin(false), setPassword('')) : alert('Incorrecto')}>Entrar</button></div>
                                {isAdmin && (
                                    <div className="mt-6 pt-6 border-t border-charcoal/10 space-y-3">
                                        <button className="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-4 rounded-2xl text-xs uppercase shadow-lg transition-all" onClick={async () => { if(window.confirm('¿Actualizar resultados con IA?')) { try { const res = await api.fetchGeminiResults(); alert(res.message); window.location.reload(); } catch(e) { alert(e.message); } } }}>🤖 Actualizar Gemini</button>
                                        <button className="w-full bg-red-100 hover:bg-red-200 text-red-600 font-black py-4 rounded-2xl text-xs uppercase transition-all" onClick={async () => { if(window.confirm('¿Borrar todo?')) { try { await api.clearAll(); alert('Reset completo.'); window.location.reload(); } catch(e) { alert(e.message); } } }}>⚠️ Reset Total</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Vegas 116 - Sterling vs Zalal - Betting Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        .fight-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 16px;
        }
        .featured-fight {
            border: 2px solid #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.1);
        }
        .score-display {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .points-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
        }
        input, select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.12);
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 40px;
        }
        .sync-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .result-section {
            background: rgba(34, 197, 94, 0.1);
            border-left: 4px solid #22c55e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .result-badge {
            display: inline-block;
            background: #22c55e;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Supabase Config
        const SUPABASE_URL = 'https://gxgjlxgmqgcqlesdebzw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zslUYT9DWZTJuhvQ_Uc3ZQ_MszDy0ar';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const UFCApp = () => {
            const [player1Name, setPlayer1Name] = useState('Papá');
            const [player2Name, setPlayer2Name] = useState('Raúl');
            const [predictions, setPredictions] = useState({});
            const [results, setResults] = useState({});
            const [connected, setConnected] = useState(false);
            const mountedRef = useRef(true);

            const fights = [
                { id: 1, fighter1: 'Marcus Almeida', fighter2: 'Ryan Spann', weight: 'Peso Semipesado', round: 3, featured: false },
                { id: 2, fighter1: 'Montel Jackson', fighter2: 'Raoni Barcelos', weight: 'Peso Gallo', round: 3, featured: false },
                { id: 3, fighter1: 'Adrian Luna Martinetti', fighter2: 'Davey Grant', weight: 'Peso Gallo', round: 3, featured: false },
                { id: 4, fighter1: 'Rafa Garcia', fighter2: 'Alexander Hernandez', weight: 'Peso Ligero', round: 3, featured: false },
                { id: 5, fighter1: 'Norma Dumont', fighter2: 'Joselyne Edwards', weight: 'Peso Pluma Femenil', round: 3, featured: false },
                { id: 6, fighter1: 'Aljamain Sterling', fighter2: 'Youssef Zalal', weight: 'Peso Pluma', round: 5, featured: true },
                { id: 7, fighter1: 'Talita Alencar', fighter2: 'Julia Polastri', weight: 'Strawweight', round: 3, featured: false },
                { id: 8, fighter1: 'Max Griffin', fighter2: 'Victor Valenzuela', weight: 'Welterweight', round: 3, featured: false },
                { id: 9, fighter1: 'Mayra Bueno Silva', fighter2: 'Michelle Montague', weight: "Women's Bantamweight", round: 3, featured: false },
            ];

            // Cargar datos de Supabase
            useEffect(() => {
                const loadData = async () => {
                    try {
                        // Subscribe a predicciones
                        const predSub = supabase
                            .from('predictions')
                            .on('*', payload => {
                                if (mountedRef.current) {
                                    loadPredictions();
                                }
                            })
                            .subscribe();

                        // Subscribe a resultados
                        const resSub = supabase
                            .from('results')
                            .on('*', payload => {
                                if (mountedRef.current) {
                                    loadResults();
                                }
                            })
                            .subscribe();

                        await loadPredictions();
                        await loadResults();
                        setConnected(true);

                        return () => {
                            predSub.unsubscribe();
                            resSub.unsubscribe();
                        };
                    } catch (err) {
                        console.error('Error:', err);
                    }
                };

                loadData();
            }, []);

            const loadPredictions = async () => {
                try {
                    const { data } = await supabase.from('predictions').select('*');
                    if (data && mountedRef.current) {
                        const grouped = {};
                        data.forEach(pred => {
                            if (!grouped[pred.fight_id]) grouped[pred.fight_id] = {};
                            if (!grouped[pred.fight_id][pred.player]) grouped[pred.fight_id][pred.player] = {};
                            grouped[pred.fight_id][pred.player][pred.field] = pred.value;
                        });
                        setPredictions(grouped);
                    }
                } catch (err) {
                    console.error('Error loading predictions:', err);
                }
            };

            const loadResults = async () => {
                try {
                    const { data } = await supabase.from('results').select('*');
                    if (data && mountedRef.current) {
                        const grouped = {};
                        data.forEach(res => {
                            if (!grouped[res.fight_id]) grouped[res.fight_id] = {};
                            grouped[res.fight_id][res.field] = res.value;
                        });
                        setResults(grouped);
                    }
                } catch (err) {
                    console.error('Error loading results:', err);
                }
            };

            const updatePrediction = async (fightId, player, field, value) => {
                try {
                    await supabase.from('predictions').upsert({
                        fight_id: fightId,
                        player: player,
                        field: field,
                        value: value
                    });
                } catch (err) {
                    console.error('Error updating prediction:', err);
                }
            };

            const updateResult = async (fightId, field, value) => {
                try {
                    await supabase.from('results').upsert({
                        fight_id: fightId,
                        field: field,
                        value: value
                    });
                } catch (err) {
                    console.error('Error updating result:', err);
                }
            };

            const calculatePoints = (fightId, player) => {
                const pred = predictions[fightId]?.[player];
                const result = results[fightId];

                if (!pred || !pred.winner || !result || !result.winner) return 0;

                let points = 0;

                // Punto por ganador
                if (pred.winner === result.winner) points += 1;

                // Punto por método
                if (pred.method === result.method) points += 2;

                // Punto por round
                if (pred.round === result.round) points += 1;

                const fight = fights.find(f => f.id === fightId);
                if (fight?.featured) {
                    return points * 2;
                }
                return points;
            };

            const getTotalScore = (player) => {
                let total = 0;
                fights.forEach(fight => {
                    total += calculatePoints(fight.id, player);
                });
                return total;
            };

            const getResultText = (fightId) => {
                const result = results[fightId];
                if (!result?.winner) return null;
                return `${result.winner} por ${result.method} - Round ${result.round}`;
            };

            return (
                <div className="min-h-screen text-white pb-20">
                    <div className="max-w-6xl mx-auto px-4 py-8">
                        {/* Header */}
                        <div className="header mb-12">
                            <div className="flex items-center justify-center mb-4">
                                <span className="sync-indicator"></span>
                                <span className="text-sm text-green-300">
                                    {connected ? 'Sincronizado en vivo ✓' : 'Conectando...'}
                                </span>
                            </div>
                            <h1 className="text-5xl font-black mb-2">🥊 UFC VEGAS 116</h1>
                            <p className="text-2xl text-yellow-300 mb-4">Sterling vs Zalal</p>
                            <p className="text-gray-300">El que gana más puntos... ¡paga las hamburguesas! 🍔</p>
                        </div>

                        {/* Score Board */}
                        <div className="grid grid-cols-2 gap-6 mb-12">
                            <div className="fight-card p-8 text-center border-l-4 border-blue-500">
                                <h2 className="text-3xl font-bold mb-4">{player1Name}</h2>
                                <div className="score-display">{getTotalScore('player1')}</div>
                                <p className="text-gray-400 mt-2">puntos</p>
                            </div>
                            <div className="fight-card p-8 text-center border-l-4 border-red-500">
                                <h2 className="text-3xl font-bold mb-4">{player2Name}</h2>
                                <div className="score-display">{getTotalScore('player2')}</div>
                                <p className="text-gray-400 mt-2">puntos</p>
                            </div>
                        </div>

                        {/* Fight Cards */}
                        <div className="space-y-6">
                            {fights.map((fight) => (
                                <div key={fight.id} className={`fight-card p-8 ${fight.featured ? 'featured-fight' : ''}`}>
                                    {fight.featured && (
                                        <div className="bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-4 py-2 rounded-full text-sm font-bold mb-6 inline-block">
                                            ⭐ PELEA ESTELAR (2x PUNTOS)
                                        </div>
                                    )}

                                    <div className="mb-8">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <h3 className="text-xl font-bold mb-2">{fight.fighter1}</h3>
                                                <p className="text-sm text-gray-400">{fight.weight}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-gray-500 text-sm">vs</p>
                                            </div>
                                            <div className="text-right">
                                                <h3 className="text-xl font-bold mb-2">{fight.fighter2}</h3>
                                                <p className="text-sm text-gray-400">{fight.round} Rounds</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Result Section */}
                                    {getResultText(fight.id) && (
                                        <div className="result-section mb-6">
                                            <p className="font-bold text-green-300">✓ Resultado Ingresado:</p>
                                            <p className="mt-2">{getResultText(fight.id)}</p>
                                        </div>
                                    )}

                                    {/* Result Input */}
                                    {!getResultText(fight.id) && (
                                        <div className="bg-orange-500/10 border-l-4 border-orange-500 p-4 rounded mb-6">
                                            <h4 className="font-bold text-orange-300 mb-3">Ingresar Resultado</h4>
                                            <div className="grid grid-cols-3 gap-3">
                                                <div>
                                                    <label className="block text-xs text-gray-400 mb-2">GANADOR</label>
                                                    <select
                                                        value={results[fight.id]?.winner || ''}
                                                        onChange={(e) => updateResult(fight.id, 'winner', e.target.value)}
                                                        className="w-full"
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value={fight.fighter1}>{fight.fighter1}</option>
                                                        <option value={fight.fighter2}>{fight.fighter2}</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-400 mb-2">MÉTODO</label>
                                                    <select
                                                        value={results[fight.id]?.method || ''}
                                                        onChange={(e) => updateResult(fight.id, 'method', e.target.value)}
                                                        className="w-full"
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        <option value="Decisión">Decisión</option>
                                                        <option value="Sumisión">Sumisión</option>
                                                        <option value="KO/TKO">KO/TKO</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-400 mb-2">ROUND</label>
                                                    <select
                                                        value={results[fight.id]?.round || ''}
                                                        onChange={(e) => updateResult(fight.id, 'round', e.target.value)}
                                                        className="w-full"
                                                    >
                                                        <option value="">Selecciona...</option>
                                                        {Array.from({length: fight.round}, (_, i) => (
                                                            <option key={i+1} value={i+1}>Round {i+1}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Predictions Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {/* Player 1 */}
                                        <div className="space-y-4">
                                            <div className="bg-blue-500/10 border-l-4 border-blue-500 p-4 rounded">
                                                <h4 className="font-bold text-blue-300 mb-4 text-lg">{player1Name}</h4>
                                                <div className="space-y-3">
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">GANADOR</label>
                                                        <select
                                                            value={predictions[fight.id]?.player1?.winner || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player1', 'winner', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            <option value={fight.fighter1}>{fight.fighter1}</option>
                                                            <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">MÉTODO</label>
                                                        <select
                                                            value={predictions[fight.id]?.player1?.method || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player1', 'method', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            <option value="Decisión">Decisión</option>
                                                            <option value="Sumisión">Sumisión</option>
                                                            <option value="KO/TKO">KO/TKO</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">ROUND</label>
                                                        <select
                                                            value={predictions[fight.id]?.player1?.round || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player1', 'round', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            {Array.from({length: fight.round}, (_, i) => (
                                                                <option key={i+1} value={i+1}>Round {i+1}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                                <div className="points-badge mt-4 text-center">
                                                    {calculatePoints(fight.id, 'player1')} {fight.featured ? '(×2)' : ''} pts
                                                </div>
                                            </div>
                                        </div>

                                        {/* Player 2 */}
                                        <div className="space-y-4">
                                            <div className="bg-red-500/10 border-l-4 border-red-500 p-4 rounded">
                                                <h4 className="font-bold text-red-300 mb-4 text-lg">{player2Name}</h4>
                                                <div className="space-y-3">
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">GANADOR</label>
                                                        <select
                                                            value={predictions[fight.id]?.player2?.winner || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player2', 'winner', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            <option value={fight.fighter1}>{fight.fighter1}</option>
                                                            <option value={fight.fighter2}>{fight.fighter2}</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">MÉTODO</label>
                                                        <select
                                                            value={predictions[fight.id]?.player2?.method || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player2', 'method', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            <option value="Decisión">Decisión</option>
                                                            <option value="Sumisión">Sumisión</option>
                                                            <option value="KO/TKO">KO/TKO</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-400 mb-2 font-semibold">ROUND</label>
                                                        <select
                                                            value={predictions[fight.id]?.player2?.round || ''}
                                                            onChange={(e) => updatePrediction(fight.id, 'player2', 'round', e.target.value)}
                                                            className="w-full"
                                                        >
                                                            <option value="">Selecciona...</option>
                                                            {Array.from({length: fight.round}, (_, i) => (
                                                                <option key={i+1} value={i+1}>Round {i+1}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                                <div className="points-badge mt-4 text-center">
                                                    {calculatePoints(fight.id, 'player2')} {fight.featured ? '(×2)' : ''} pts
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Footer */}
                        <div className="mt-12 text-center text-gray-500 text-sm">
                            <p>✨ Sincronización en vivo con Supabase ✨</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>

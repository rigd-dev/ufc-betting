                                    {[ ['EDAD', 'age'], ['ALTURA', 'height'], ['PESO', 'weightLbs'], ['ALCANCE', 'reach'], ['ALCANCE PIERNA', 'legReach'] ].map(([label, key]) => (
                                        <div key={key} className="relative group">
                                            <div className="flex justify-between text-2xl md:text-4xl font-black mb-4 px-2">
                                                <span className="text-accentWarm glow-warm">{taleOfTape.f1[key] || '---'}</span>
                                                <span className="text-accentCool glow-cool">{taleOfTape.f2[key] || '---'}</span>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[10px] font-black tracking-[0.5em] opacity-30 uppercase whitespace-nowrap bg-[#222] px-4 py-1 rounded-full border border-white/5">{label}</div>
                                            <div className="h-1.5 bg-white/5 rounded-full overflow-hidden flex shadow-2xl border border-white/5 backdrop-blur-sm">
                                                <div className="h-full bg-gradient-to-r from-orange-700 to-accentWarm" style={{width: '50%'}}></div>
                                                <div className="h-full bg-gradient-to-r from-accentCool to-blue-800" style={{width: '50%'}}></div>
                                            </div>
                                        </div>
                                    ))}

                                    <div className="grid grid-cols-3 gap-6 pt-16 border-t border-white/5 mt-16">
                                        <div className="text-center bg-white/[0.03] p-8 rounded-[35px] border border-white/5 backdrop-blur-xl group hover:border-accentWarm/20 transition">
                                            <div className="text-[10px] font-black opacity-30 mb-3 tracking-[0.2em] uppercase">KO Artist</div>
                                            <div className="text-2xl md:text-3xl font-black flex items-center justify-center gap-3">
                                                <span className="text-accentWarm">{taleOfTape.f1.ko || 0}%</span>
                                                <span className="text-white/10">|</span>
                                                <span className="text-accentCool">{taleOfTape.f2.ko || 0}%</span>
                                            </div>
                                        </div>
                                        <div className="text-center bg-white/[0.03] p-8 rounded-[35px] border border-white/5 backdrop-blur-xl group hover:border-white/20 transition">
                                            <div className="text-[10px] font-black opacity-30 mb-3 tracking-[0.2em] uppercase">Submission</div>
                                            <div className="text-2xl md:text-3xl font-black flex items-center justify-center gap-3">
                                                <span className="text-accentWarm">{taleOfTape.f1.sub || 0}%</span>
                                                <span className="text-white/10">|</span>
                                                <span className="text-accentCool">{taleOfTape.f2.sub || 0}%</span>
                                            </div>
                                        </div>
                                        <div className="text-center bg-white/[0.03] p-8 rounded-[35px] border border-white/5 backdrop-blur-xl group hover:border-accentCool/20 transition">
                                            <div className="text-[10px] font-black opacity-30 mb-3 tracking-[0.2em] uppercase">Decision</div>
                                            <div className="text-2xl md:text-3xl font-black flex items-center justify-center gap-3">
                                                <span className="text-accentWarm">{taleOfTape.f1.dec || 0}%</span>
                                                <span className="text-white/10">|</span>
                                                <span className="text-accentCool">{taleOfTape.f2.dec || 0}%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>

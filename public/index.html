                }
            ];

                const load = async () => {
                    const [preds, ress] = await Promise.all([api.getPredictions(), api.getResults()]);
                    const pMap = {}, rMap = {}, cMap = {};
                    preds.forEach(p => { if(!pMap[p.fight_id]) pMap[p.fight_id]={}; if(!pMap[p.fight_id][p.player]) pMap[p.fight_id][p.player]={}; pMap[p.fight_id][p.player][p.field] = p.value; });
                    ress.forEach(r => { if(!rMap[r.fight_id]) rMap[r.fight_id]={}; if(r.field==='confirmed') cMap[r.fight_id]=true; else rMap[r.fight_id][r.field] = r.value; });
                    setPredictions(pMap); setResults(rMap); setConfirmedResults(cMap);
                };
                load();
            }, []);

            const handlePred = (id, pl, f, v) => {
                setPredictions(prev => ({...prev, [id]: {...prev[id], [pl]: {...(prev[id]?.[pl]||{}), [f]: v}}}));
                api.savePrediction(id, pl, f, v);
            };

            const handleRes = (id, f, v) => {
                setResults(prev => ({...prev, [id]: {...(prev[id]||{}), [f]: v}}));
                api.saveResult(id, f, v);
            };

            const calcPts = (id, pl) => {
                const p = predictions[id]?.[pl], r = results[id];
                if (!p?.winner || !r?.winner || !confirmedResults[id]) return 0;
                let pts = 0;
                if (p.winner === r.winner) pts += 1;
                if (p.method === r.method) pts += 1;
                if (p.round == r.round || (p.round === 'final' && r.round === 'final')) pts += 1;
                return allFights.find(f => f.id === id)?.featured ? pts * 2 : pts;

            const getSilhouette = (name) => `https://ui-avatars.com/api/?name=${name.replace(' ', '+')}&background=EAEAEA&color=1A1A1A&size=256&font-size=0.33&bold=true`;

                    'Peso Ligero': '155.0 lbs',

                    'Peso Medio': '185.0 lbs',
                    'Peso Semicompleto': '205.0 lbs',
                    'Peso Completo': '265.0 lbs'

                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-xs font-bold bg-charcoal/5 px-2 py-1 rounded text-charcoal">
                                                            {fight.m}
                                                        </span>
                                                        <span className="text-[10px] text-secondary font-bold ml-2 uppercase">
                                                            Rnd {fight.rnd}
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LOGIN & GLOBAL ADMIN TOOLS MODAL */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-charcoal/60 backdrop-blur-md flex items-center justify-center z-[100] p-4 modal-overlay">
                            <div className="bg-cream p-8 rounded-3xl w-full max-w-sm modal-content shadow-2xl border border-white">
                                <h2 className="font-sans font-black uppercase tracking-tight text-3xl mb-2 text-center">Admin Access</h2>
                                
                                {!isAdmin ? (
                                    <>
                                        <p className="text-xs text-secondary text-center mb-6 uppercase tracking-widest font-bold">Autenticación requerida</p>
                                        <input 
                                            type="password" placeholder="Contraseña..." 
                                            className="w-full mb-6 bg-white border-2 border-charcoal/10 focus:border-charcoal focus:ring-0 rounded-xl px-5 py-4 text-sm font-bold transition"
                                            value={password} onChange={e => setPassword(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && (password === 'ufc2026' ? (setIsAdmin(true), setPassword('')) : alert('Incorrecto'))}
                                        />
                                        <div className="flex gap-3">
                                            <button className="flex-1 bg-white border border-charcoal/10 font-bold py-3.5 rounded-xl text-sm shadow-sm hover:bg-gray-50 transition" onClick={() => setShowLogin(false)}>Cancelar</button>
                                            <button className="flex-1 bg-charcoal text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-black transition" onClick={() => password === 'ufc2026' ? (setIsAdmin(true), setPassword('')) : alert('Incorrecto')}>Entrar</button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="space-y-4 mt-6">
                                        <button className="w-full flex items-center justify-center gap-2 bg-purple-600 hover:bg-purple-700 text-white font-black uppercase tracking-wider py-4 rounded-xl text-sm transition shadow-lg"
                                            onClick={async () => {
                                                if(window.confirm('¿Actualizar automáticamente todos los resultados con Inteligencia Artificial (Gemini)?')) {
                                                    try { const res = await api.fetchGeminiResults(); alert(res.message); window.location.reload(); } catch(e) { alert(e.message); }
                                                }
                                            }}>
                                            🤖 Actualizar con Gemini
                                        </button>
                                        <button className="w-full flex items-center justify-center gap-2 bg-danger/10 hover:bg-danger/20 text-danger border border-danger/30 font-black uppercase tracking-wider py-4 rounded-xl text-sm transition"
                                            onClick={async () => {
                                                if(window.confirm('⚠️ ¿ESTÁS SEGURO? Esto borrará TODAS las predicciones y resultados.')) {
                                                    try { await api.clearAll(); alert('Base de datos vaciada exitosamente.'); window.location.reload(); } catch(e) { alert(e.message); }
                                                }
                                            }}>
                                            ⚠️ Borrar Todo (Reset)
                                        </button>
                                        <div className="pt-4 border-t border-charcoal/10">
                                            <button className="w-full bg-white border border-charcoal/10 font-bold py-3 rounded-xl text-sm mb-2" onClick={() => { setIsAdmin(false); setShowLogin(false); }}>
                                                Cerrar Sesión
                                            </button>
                                            <button className="w-full text-secondary font-bold text-xs uppercase tracking-widest py-2" onClick={() => setShowLogin(false)}>
                                                Cerrar Panel
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<UFCApp />);
    </script>
</body>
</html>
